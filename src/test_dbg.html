<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>왕BTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=Gowun+Dodum&display=swap" media="print" onload="this.media='all'">
<style>
/* 어좌 뒤 일월오봉도: 해(주홍)·달·다섯 봉우리(석록)·물결(군청). 위에는 늘 보이는 나라 살림판, 아래는 시기마다 바뀌는 국정 화면. 닮은 왕 공개 장면은 밤의 궁궐(늘 어두운 배경)에 오방색 꽃가루. */
:root {
  --bg: #E9EEEA; --paper: #F8FAF6; --sunk: #DFE6E1; --ink: #1C2427; --muted: #59665F; --line: #C3CFC8;
  --sun: #B9352A; --peak: #2C6A57; --gold: #A97C25; --sky: #24496A; --plum: #74507F;
  --good: #2C7A4E; --warn: #A3660E; --bad: #B9352A;
  --moon: #FFFFFF; --wave: #9DB6C6;
  --bronze: #8A5A2B; --hanji: #F7F0DE;
  --rv-bg: #1A0D0A; --rv-glow: #4A1A12; --rv-ink: #F6EBD6; --rv-gold: #F2C14E; --rv-red: #E0523F; --door: #8E2219;
  --font-display: "Hahmlet", "Nanum Myeongjo", "Batang", serif;
  --font-body: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F171B; --paper: #162228; --sunk: #1D2C33; --ink: #E6EEEA; --muted: #9AACA4; --line: #2C3E45;
    --sun: #E46A55; --peak: #5DB596; --gold: #DDB25A; --sky: #86B0D6; --plum: #BE98CC;
    --good: #66C690; --warn: #E3A84F; --bad: #E46A55;
    --moon: #F2F5F3; --wave: #3B5869;
    --bronze: #D49A61; --hanji: #221D15;
    --rv-bg: #1A0D0A; --rv-glow: #4A1A12; --rv-ink: #F6EBD6; --rv-gold: #F2C14E; --rv-red: #E0523F; --door: #8E2219;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F171B; --paper: #162228; --sunk: #1D2C33; --ink: #E6EEEA; --muted: #9AACA4; --line: #2C3E45;
  --sun: #E46A55; --peak: #5DB596; --gold: #DDB25A; --sky: #86B0D6; --plum: #BE98CC;
  --good: #66C690; --warn: #E3A84F; --bad: #E46A55;
  --moon: #F2F5F3; --wave: #3B5869;
    --bronze: #D49A61; --hanji: #221D15;
    --rv-bg: #1A0D0A; --rv-glow: #4A1A12; --rv-ink: #F6EBD6; --rv-gold: #F2C14E; --rv-red: #E0523F; --door: #8E2219;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 17px; line-height: 1.6; padding-inline: 16px; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 12px 48px; display: grid; gap: 16px; }

/* 나라 살림판 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); padding-block: 8px; display: grid; gap: 6px; }
.bar .who { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.bar .who b { font-family: var(--font-display); font-size: 20px; }
.bar .who span { color: var(--muted); font-size: 15px; }
.bar .who .btn { margin-left: auto; }
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(3px); }
.modal { width: min(440px, 100%); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; box-shadow: 0 18px 50px rgba(0, 0, 0, .18); }
.modal h2 { font-size: 24px; }
.modal .row { justify-content: flex-end; }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 7px; align-items: center; min-width: 0; }
.seal { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 5px; background: var(--sun); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 17px; line-height: 1; grid-row: span 2; }
.stat .n { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 18px; }
.meter { grid-column: 2 / 4; height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--peak); border-radius: 999px; transition: width .5s ease; }
.stat.low .meter i { background: var(--bad); }
.stat.low .v { color: var(--bad); }
.stat.flash { animation: flash .9s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--gold); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* 첫 화면 */
.hero { display: grid; gap: 14px; }
.screen { width: 100%; max-width: 100%; height: auto; display: block; border-radius: 12px; }
.hero h1 { font-size: clamp(40px, 7vw, 68px); font-weight: 800; line-height: 1.05; }
.hero .lead { font-size: 19px; max-width: 62ch; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel h2 { font-size: 24px; }
.sub { font-size: 15px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { display: grid; gap: 4px; }
.field input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; width: 14em; max-width: 100%; }
.scens { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 10px; }
.scen { text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: grid; gap: 6px; }
.scen[aria-pressed="true"] { border-color: var(--sun); background: color-mix(in srgb, var(--sun) 7%, var(--paper)); }
.scen b { font-family: var(--font-display); font-size: 20px; }
.scen small { color: var(--muted); }
.goals { display: grid; gap: 6px; counter-reset: g; max-width: 560px; }
.goal { display: grid; grid-template-columns: 34px 28px 1fr auto; gap: 8px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.goal .no { font-weight: 700; color: var(--sun); text-align: center; font-variant-numeric: tabular-nums; }
.goal .seal { grid-row: auto; width: 26px; height: 26px; font-size: 15px; }
.goal .mv { display: flex; gap: 4px; }

.btn { border: 1px solid var(--line); background: var(--paper); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { font-size: 14px; padding: 3px 9px; }
.btn.go { background: var(--sun); border-color: var(--sun); color: #fff; font-weight: 700; padding: 11px 22px; font-size: 18px; }
.btn.ink { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; padding: 10px 20px; }

/* 시기 머리 */
.era { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.era h2 { font-size: 30px; }
.era .t { font-weight: 700; color: var(--sun); font-variant-numeric: tabular-nums; }
.timeline { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.timeline span { height: 8px; border-radius: 999px; background: var(--sunk); }
.timeline span.on { background: var(--sun); }
.timeline span.done { background: var(--peak); }

/* 사건 */
.event { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; }
@media (max-width: 560px) { .event { grid-template-columns: minmax(0, 1fr); } }
.bigseal { width: 74px; height: 74px; border: 3px solid var(--sun); color: var(--sun); border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display); font-size: 42px; font-weight: 800; transform: rotate(-4deg); }
.event h3 { font-size: 26px; }
.event .txt { font-size: 18px; max-width: 64ch; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 14px; cursor: pointer; display: grid; gap: 2px; }
.choice:hover { border-color: var(--sun); }
.choice b { font-size: 17px; }
.choice small { color: var(--muted); font-size: 14px; }
.result { border-left: 5px solid var(--gold); background: var(--paper); border-radius: 8px; padding: 10px 14px; display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 14px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.up { border-color: var(--good); color: var(--good); }
.chip.down { border-color: var(--bad); color: var(--bad); }

/* 정책 */
.ap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gold); display: inline-block; }
.pips i.on { background: var(--gold); }
.advice { background: color-mix(in srgb, var(--gold) 12%, var(--paper)); border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line)); border-radius: 10px; padding: 10px 14px; display: grid; gap: 4px; }
.advice b { font-family: var(--font-display); }
.advice li { margin-left: 1.1em; }
.advice ul { margin: 0; padding: 0; display: grid; gap: 2px; }
.queue { display: grid; gap: 6px; }
.qi { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.qi .no { font-weight: 800; color: var(--sun); text-align: center; font-family: var(--font-display); font-size: 20px; }
.qi.err { border-color: var(--bad); }
.qi .warn { color: var(--bad); font-size: 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 15px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { text-align: left; border: 1px solid var(--line); border-top: 5px solid var(--cc); background: var(--paper); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; gap: 6px; align-content: start; position: relative; }
.card:hover:not([aria-disabled="true"]) { border-color: var(--cc); }
.card[aria-pressed="true"] { outline: 3px solid var(--cc); }
.card[aria-disabled="true"] { cursor: not-allowed; opacity: .62; }
.card .top { display: flex; gap: 8px; align-items: flex-start; }
.card .cat { width: 26px; height: 26px; border-radius: 5px; background: var(--cc); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; flex: none; }
.card h4 { margin: 0; font-family: var(--font-display); font-size: 18px; line-height: 1.3; }
.card .who { font-size: 13px; color: var(--muted); }
.card .desc { font-size: 15px; }
.card .eff { display: flex; flex-wrap: wrap; gap: 4px; }
.card .eff span { font-size: 13px; padding: 0 6px; border-radius: 5px; background: var(--sunk); white-space: nowrap; }
.card .eff .u { color: var(--good); }
.card .eff .d { color: var(--bad); }
.card .note { font-size: 13px; color: var(--warn); }
.card .lock { font-size: 13px; color: var(--bad); font-weight: 700; }
.card .cost { margin-left: auto; flex: none; padding-top: 4px; }
.card.locked { opacity: .78; }
.card .top > span:nth-child(2) { min-width: 0; }
.card .badge { font-size: 13px; font-weight: 700; color: var(--cc); }
.card.done { border-top-color: var(--line); }

/* 실록 */
.sillok { display: grid; gap: 10px; }
.entry { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.entry .h { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; background: var(--cc, var(--gold)); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.entry b { font-family: var(--font-display); font-size: 18px; }
.entry.fail { border-color: var(--bad); }
.warnbox { border: 2px solid var(--bad); border-radius: 10px; padding: 10px 14px; background: color-mix(in srgb, var(--bad) 7%, var(--paper)); }

/* 결말 */
.fate h1 { font-size: clamp(34px, 6vw, 54px); font-weight: 800; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.record { border: 3px double var(--ink); border-radius: 6px; padding: 14px 16px; background: var(--paper); display: grid; gap: 8px; align-content: start; }
.record .stamp { justify-self: start; border: 3px solid var(--sun); color: var(--sun); font-family: var(--font-display); font-size: 26px; font-weight: 800; padding: 2px 12px; transform: rotate(-3deg); border-radius: 4px; }
.record.tyrant .stamp { background: var(--sun); color: #fff; }
.record .today { border-top: 1px dashed var(--line); padding-top: 8px; font-size: 15px; }
.axes { display: grid; gap: 10px; }
.axis { display: grid; grid-template-columns: 76px minmax(0, 1fr) 96px; gap: 8px; align-items: center; font-size: 15px; }
.axis .l { text-align: right; }
.axis .track { position: relative; height: 14px; background: var(--sunk); border-radius: 999px; }
.axis .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--line); }
.axis .dot { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: var(--sun); border: 3px solid var(--paper); transform: translate(-50%, -50%); }
.axis b.on { color: var(--sun); }
.code { font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: .08em; }
.kingcard { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: start; }
.kingseal { width: 92px; height: 92px; border-radius: 50%; background: var(--sun); color: #fff; display: grid; place-items: center; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.1; }
.pct { font-size: 34px; font-weight: 800; font-family: var(--font-display); color: var(--sun); font-variant-numeric: tabular-nums; }
.others { display: grid; gap: 6px; }
.others div { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 8px; align-items: center; font-size: 15px; }
.others .bar2 { height: 8px; background: var(--sunk); border-radius: 999px; overflow: hidden; grid-column: 1 / -1; }
.others .bar2 i { display: block; height: 100%; background: var(--gold); }
.tl { display: grid; gap: 8px; }
.tl .p { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; font-size: 15px; border-top: 1px solid var(--line); padding-top: 6px; }
.tl .p b { color: var(--sun); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { border-top: 1px solid var(--line); padding: 6px 8px; text-align: left; font-variant-numeric: tabular-nums; }
th { font-size: 13px; color: var(--muted); font-weight: 400; }
.tbl { overflow-x: auto; }
.qs { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: 17px; }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } .stat.flash { animation: none; } }

/* ===== v2 더한 것 ===== */
.stat.danger { border-color: var(--bad); animation: pulse 1.2s ease-in-out infinite; }
.stat.danger .meter i { background: var(--bad); }
.stat.danger .v { color: var(--bad); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 45%, transparent); } }
.bar .who .inc { font-size: 14px; color: var(--bronze); font-weight: 700; }

/* 시작 나라 카드 */
.scen .sh { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; justify-content: space-between; }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 15px; white-space: nowrap; }
.stars i { font-style: normal; color: var(--line); }
.scen { align-content: start; }
.scen .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.scen .tags:empty { display: none; }
.tag { justify-self: start; align-self: start; display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; line-height: 1.5; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.tag.war { color: var(--bad); }
.tag.good { color: var(--good); }
.scen .mini { display: flex; flex-wrap: wrap; gap: 4px; }
.scen .mini i { font-style: normal; font-family: var(--font-display); font-size: 13px; background: var(--sunk); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.scen .mini b { color: var(--ink); margin-left: 3px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.scen.warlike[aria-pressed="true"] { border-color: var(--bad); }

/* 다스림 원칙 드롭다운 */
.gsels { display: grid; gap: 8px; max-width: 720px; }
.gsel { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; grid-template-areas: "no lab bonus" "no sel sel"; gap: 2px 10px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.gsel .no { grid-area: no; font-family: var(--font-display); font-size: 24px; font-weight: 800; color: var(--sun); text-align: center; }
.gsel .sub { grid-area: lab; }
.gsel .bonus { grid-area: bonus; font-size: 13px; color: var(--good); white-space: nowrap; }
.gsel select { grid-area: sel; width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 10px; font-size: 16px; }

/* 나라 살림 */
.econ { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.eopt { position: relative; display: grid; gap: 4px; align-content: start; border: 2px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px 8px 34px; cursor: pointer; }
.eopt input { position: absolute; left: 10px; top: 11px; width: 16px; height: 16px; accent-color: var(--bronze); margin: 0; }
.eopt.on { border-color: var(--bronze); background: color-mix(in srgb, var(--bronze) 9%, var(--paper)); }
.eopt b { font-size: 16px; }
.eopt:focus-within { outline: 3px solid var(--sky); outline-offset: 2px; }
.danger-note { color: var(--bad); font-weight: 700; border: 2px solid var(--bad); border-radius: 8px; padding: 6px 10px; background: color-mix(in srgb, var(--bad) 7%, var(--paper)); }
.warn-note { color: var(--warn); font-weight: 700; }
.card .eff .incb { background: color-mix(in srgb, var(--bronze) 16%, var(--paper)); color: var(--bronze); font-weight: 700; }
.bigseal.alarm { border-color: var(--bad); color: var(--paper); background: var(--bad); animation: shake .5s ease 2; }
@keyframes shake { 0%, 100% { transform: rotate(-4deg); } 25% { transform: rotate(-8deg) translateX(-3px); } 75% { transform: rotate(0deg) translateX(3px); } }

/* 결말 */
.fhead { display: flex; gap: 14px; align-items: center; }
.fseal { flex: none; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 10px; background: var(--peak); color: #fff; font-family: var(--font-display); font-size: 38px; font-weight: 800; transform: rotate(-4deg); }
.fate.big .fseal { background: var(--gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 30%, transparent); }
.fate.bad .fseal { background: var(--bad); }
.fate.over { border: 3px solid var(--bad); background: color-mix(in srgb, var(--bad) 6%, var(--paper)); }
.fate.over h1 { color: var(--bad); }
.flead { font-size: 19px; max-width: 64ch; }
.histbox { border-left: 5px solid var(--bad); background: var(--paper); border-radius: 8px; padding: 10px 14px; display: grid; gap: 4px; }
.histbox b { font-family: var(--font-display); }
.record { position: relative; }
.record .stamp { animation: stamp .7s cubic-bezier(.2, 1.6, .4, 1) both .2s; }
@keyframes stamp { from { transform: rotate(-14deg) scale(2.4); opacity: 0; } to { transform: rotate(-3deg) scale(1); opacity: 1; } }
.record.great { border-color: var(--gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 20%, transparent); }

/* ===== 닮은 왕 공개 ===== */
.reveal { position: fixed; inset: 0; z-index: 30; overflow-y: auto; background: radial-gradient(circle at 50% 35%, var(--rv-glow), var(--rv-bg) 70%); color: var(--rv-ink); display: flex; flex-direction: column; align-items: center; padding: 52px 16px 24px; }
.reveal .fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.rays { position: fixed; left: 50%; top: 38%; width: 130vmax; height: 130vmax; margin: -65vmax 0 0 -65vmax; will-change: transform, rotate; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rv-gold) 22%, transparent) 0deg 8deg, transparent 8deg 20deg); opacity: 0; transform: scale(.4); transition: opacity 1s ease, transform 1.2s ease; pointer-events: none; z-index: 0; }
.reveal.p2 .rays { opacity: 1; transform: scale(1); animation: spin 26s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.rv-tools { position: fixed; top: 10px; right: 12px; z-index: 4; display: flex; gap: 8px; }
.rv-btn { border: 1px solid color-mix(in srgb, var(--rv-ink) 40%, transparent); background: color-mix(in srgb, var(--rv-bg) 70%, transparent); color: var(--rv-ink); border-radius: 999px; padding: 4px 12px; font-size: 14px; cursor: pointer; }
.rv-btn:hover { border-color: var(--rv-gold); }
.rv-stage { position: relative; z-index: 3; margin: auto 0; width: min(560px, 100%); display: grid; gap: 8px; justify-items: center; text-align: center; }
.rv-top { font-family: var(--font-display); font-size: clamp(20px, 4.4vw, 28px); font-weight: 700; color: var(--rv-gold); animation: fadeUp .7s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.rv-frame { position: relative; transition: width .8s ease; width: clamp(170px, calc((100vh - 330px) * 0.74), min(270px, 64vw)); aspect-ratio: 200 / 270; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 3px var(--rv-gold), 0 20px 60px rgba(0, 0, 0, .5); }
.reveal.p4 .rv-frame { width: clamp(130px, calc((100vh - 560px) * 0.74), min(210px, 50vw)); }
.reveal.p2 .rv-frame { animation: glow 2.4s ease-in-out infinite .8s; }
@keyframes glow { 50% { box-shadow: 0 0 0 3px var(--rv-gold), 0 0 50px 10px color-mix(in srgb, var(--rv-gold) 55%, transparent); } }
.rv-portrait { position: absolute; inset: 0; }
.rv-portrait .portrait { width: 100%; height: 100%; display: block; transform: scale(1.12); filter: brightness(.6); transition: transform 1.4s ease .3s, filter 1s ease .3s; }
.reveal.p2 .rv-portrait .portrait { transform: none; filter: none; }
.door { position: absolute; top: 0; bottom: 0; width: 50%; background-color: var(--door); background-image: radial-gradient(circle, var(--rv-gold) 0 3px, transparent 3.5px); background-size: 26px 26px; background-position: 6px 8px; border: 3px solid color-mix(in srgb, var(--door) 60%, #000); transition: transform .9s cubic-bezier(.7, 0, .3, 1); z-index: 1; }
.door.l { left: 0; border-right-width: 2px; }
.door.r { right: 0; border-left-width: 2px; }
.door.l::after, .door.r::after { content: ""; position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--rv-gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rv-gold) 40%, #000); }
.door.l::after { right: 8px; }
.door.r::after { left: 8px; }
.reveal.p2 .door.l { transform: translateX(-102%); }
.reveal.p2 .door.r { transform: translateX(102%); }
.rv-roul { position: absolute; left: 6%; right: 6%; top: 50%; transform: translateY(-50%); z-index: 2; padding: 10px 6px; border-radius: 8px; background: color-mix(in srgb, var(--rv-bg) 82%, transparent); border: 2px solid var(--rv-gold); color: var(--rv-gold); font-family: var(--font-display); font-weight: 800; font-size: clamp(18px, 5vw, 24px); line-height: 1.2; transition: opacity .4s ease; }
.reveal.p1 .rv-roul { animation: pop .4s ease; }
.reveal.p2 .rv-roul { opacity: 0; }
@keyframes pop { 50% { transform: translateY(-50%) scale(1.15); } }
.rv-name { display: grid; gap: 2px; opacity: 0; }
.rv-era { color: var(--rv-gold); font-size: 16px; letter-spacing: .1em; }
.rv-stamp { font-family: var(--font-display); font-weight: 800; font-size: clamp(36px, 9vw, 56px); line-height: 1.1; color: #fff; text-shadow: 0 0 18px color-mix(in srgb, var(--rv-gold) 80%, transparent), 0 3px 0 var(--door); }
.reveal.p3 .rv-name { opacity: 1; animation: slam .55s cubic-bezier(.2, 1.7, .4, 1) both; }
@keyframes slam { from { transform: scale(3) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }
.reveal.p3 .rv-stage { animation: quake .4s ease .08s; }
@keyframes quake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
.rv-pct { opacity: 0; font-size: 20px; }
.rv-pct b { font-family: var(--font-display); font-size: 40px; color: var(--rv-gold); font-variant-numeric: tabular-nums; }
.reveal.p3 .rv-pct { opacity: 1; transition: opacity .3s ease; }
.rv-more { display: grid; gap: 10px; justify-items: center; opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease; pointer-events: none; }
.reveal.p4 .rv-more { opacity: 1; transform: none; pointer-events: auto; }
.rv-bio { font-size: 17px; max-width: 46ch; color: var(--rv-ink); }
.rv-same { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; font-size: 15px; }
.rv-same span { border: 1px solid var(--rv-gold); color: var(--rv-gold); border-radius: 999px; padding: 0 10px; }
.rv-twist { display: grid; gap: 2px; border: 2px solid var(--rv-red); background: color-mix(in srgb, var(--rv-red) 22%, var(--rv-bg)); border-radius: 10px; padding: 8px 14px; opacity: 0; }
.reveal.p4 .rv-twist { animation: twist .6s ease both .9s; }
@keyframes twist { 0% { opacity: 0; transform: scale(.6) rotate(4deg); } 60% { opacity: 1; transform: scale(1.08) rotate(-2deg); } 100% { opacity: 1; transform: none; } }

.reveal.instant *, .reveal.instant { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  .stat.danger, .bigseal.alarm, .record .stamp { animation: none; }

        C("힘센 부족장의 딸과 혼인하고 형제의 맹세를 맺는다", () => R({ har: 10, kp: -3 }, "부족장들과 가족이 되자 부족 사이의 다툼이 줄었어요.", [-0.8, 0, 0])),
        C("따르지 않는 부족을 말발굽으로 굴복시킨다", () => { tyrUp(1); return R({ kp: 8, har: -9, def: -3 }, "반항하던 부족이 무릎을 꿇었지만, 다른 부족들은 칸을 두려워하기 시작했어요.", [0.9, 0.8, 0]); }),
      ] },
    g2: { h: "驛", title: "끊어진 비단길", text: () => "동쪽과 서쪽을 잇는 비단길에 도적이 들끓어 상인들이 초원을 지나가지 못해요. 상인이 오지 않으니 곡식도, 옷감도, 쇠붙이도 귀해졌어요.",
      choices: () => [
        C("길마다 말을 갈아타는 역참을 세운다", () => { addInc(2); S.flags.yam = true; return R({ gold: -6, kp: 3 }, "하루에 수백 리를 달리는 역참이 생겼어요. 상인들이 다시 오가고 칸의 명령도 빨리 전해졌어요.", [0.3, 0, 0.2]); }, "매 시기 수입이 늘어요."),
        C("상인을 해치는 자는 엄하게 벌한다는 법을 세운다", () => R({ kp: 4, gold: 3, ppl: 1 }, "'상인을 해치면 엄하게 벌한다!' 칸의 법이 초원 전체에 퍼졌어요(예케 자사크처럼).", [0.5, 0, -0.5])),
        C("우리가 직접 상인을 털어 곳간을 채운다", () => { tyrUp(1); return R({ gold: 11, ppl: -5, cul: -2 }, "곳간은 찼지만, 상인들은 초원을 피해 먼 길로 돌아가기 시작했어요.", [0.5, 0.5, -0.6]); }),
      ] },
    g3: { h: "使", title: "해를 입은 사신단", text: () => `서쪽의 큰 나라(호라즘)로 보낸 상인과 사신들이 그 나라 성주에게 붙잡혀 해를 입었어요. 부족장들은 분노해 복수를 외쳐요. 그 나라의 힘은 약 ${enemyPow()}, 우리 힘은 약 ${numIe(myPow())}.`,
      choices: () => [
        C("대군을 이끌고 복수의 원정을 떠난다", () => { const m = myPow(), e = enemyPow(); if (m >= e) { S.flags.conquered = true; S.flags.warWon = true; addInc(2); return R({ def: 4, gold: 12, kp: 8, ppl: -3 }, `몽골 기병이 바람처럼 달려 서쪽의 큰 나라를 무너뜨렸어요! 우리 ${m} : 적 ${e}. 넓은 땅과 비단길이 손에 들어왔어요.`, [0.6, 1, 0]); } S.flags.warLost = true; return R({ def: -14, kp: -6, ppl: -6 }, `먼 길을 달려간 군대가 지쳐 크게 졌어요. 우리 ${m} : 적 ${e}.`, [0.6, 1, 0], { ok: false }); }, "우리 힘이 적보다 크면 이겨요."),
        C("다시 사신을 보내 사과와 배상을 받는다", () => S.st.kp >= 55 ? R({ gold: 8, kp: 3 }, "칸의 위엄에 놀란 그 나라가 사과하고 많은 보물을 보냈어요.", [0.2, -0.3, 0]) : R({ kp: -6, har: -4 }, "그 나라는 사신마저 쫓아냈어요. 부족장들이 칸을 겁쟁이라고 수군거렸어요.", [0.2, -0.3, 0], { ok: false }), "왕권이 55 이상이면 통해요."),
        C("참고 나라 안을 먼저 다진다", () => R({ kp: -4, ppl: 4, cul: 3 }, "칸은 분노를 삼키고 나라 안을 돌보았어요. 부족장들은 아쉬워했지만 백성들은 쉬었어요.", [-0.3, -0.4, 0.4])),
      ] },
    g5: { h: "征", title: "끝없는 정복의 길", text: () => "말발굽이 닿는 곳마다 땅이 넓어졌어요. 장수들은 더 서쪽, 더 남쪽으로 가자고 해요. 하지만 군사들은 오랜 전쟁에 지쳐 가고 있어요.",
      choices: () => [
        C("세상 끝까지 계속 나아간다", () => { if (S.st.def >= 50) { S.flags.conquered = true; addInc(1); return R({ gold: 10, def: -8, ppl: -6, kp: 4 }, "몽골의 깃발이 유럽 가까이까지 휘날렸어요. 하지만 고향을 떠난 군사와 가족들은 지쳐 갔어요.", [0.6, 1, -0.2]); } return R({ def: -12, ppl: -6 }, "지친 군대가 낯선 땅에서 큰 피해를 입고 돌아왔어요.", [0.6, 1, -0.2], { ok: false }); }, "국방이 50 이상이어야 해요."),
        C("정복한 땅에 관리를 두고 다스림을 다진다", () => R({ kp: 5, gold: 5, har: -5, cul: 2 }, "정복한 땅마다 관리(다루가치)를 두어 세금을 걷고 질서를 세웠어요.", [0.6, -0.2, -0.6])),
        C("넓은 땅을 아들들에게 나누어 맡긴다", () => R({ har: 10, kp: -8 }, "아들들이 저마다 땅을 맡아 다스렸어요. 훗날 제국은 여러 나라(울루스)로 나뉘게 돼요.", [-0.8, 0, 0])),
      ] },
    g7: { h: "智", title: "끌려온 학자와 기술자들", text: () => "정복한 나라에서 글을 아는 학자, 성을 무너뜨리는 기계를 만드는 기술자, 병을 고치는 의사들이 붙잡혀 왔어요.",
      choices: () => [
        C("칸의 도읍으로 데려와 일을 맡긴다", () => R({ cul: 10, gold: -4, def: 3 }, "몽골 제국 아래에서 동쪽과 서쪽의 지식과 기술이 활발히 오갔어요.", [0.1, -0.7, 0])),
        C("고향으로 돌려보내고 세금만 받는다", () => R({ ppl: 4, gold: 3 }, "학자와 기술자들이 고향에서 일하며 세금을 냈어요. 정복지 사람들의 원망이 줄었어요.", [-0.3, 0, 0.6])),
        C("쓸모없다며 가두어 둔다", () => { tyrUp(1); return R({ cul: -5, kp: 3, gold: 3 }, "귀한 지식과 기술이 감옥 안에서 잊혀 갔어요.", [0.6, 0.3, 0]); }),
      ] },
    dzud: { h: "雪", title: "가축이 얼어 죽는 겨울", base: () => ({ gold: -6, ppl: has("relief") ? -2 : -6 }), text: () => "몇 년 만의 혹독한 추위와 눈보라(조드)가 초원을 덮쳐 양과 말이 얼어 죽었어요. 유목민에게 가축은 집이자 곳간이에요." + (has("relief") ? " 진대법처럼 미리 모아 둔 곡식이 있어 피해가 줄었어요." : ""),
      choices: () => [
        C("곳간을 열어 가축과 곡식을 나눈다", () => R({ gold: -10, ppl: 11 }, "칸의 곳간에서 나온 곡식과 가축으로 많은 가족이 겨울을 넘겼어요.", [0, 0, 0.9])),
        C("남쪽 농사짓는 나라에서 곡식을 사 온다", () => R({ gold: -6, ppl: 6, cul: 2 }, "비단길로 곡식을 사 와 위기를 넘겼어요.", [0, 0, 0.5])),
        C("정복한 땅에서 세금을 더 거둔다", () => { tyrUp(1); return R({ gold: 8, ppl: -6, har: -3 }, "곳간은 채웠지만, 정복한 땅의 사람들이 칸을 원망했어요.", [0.5, 0, -0.7]); }),
      ] },
    g9: { h: "島", title: "섬으로 들어간 고려", text: () => "동쪽의 고려가 항복하지 않고 도읍을 강화도로 옮겼어요. 말을 탄 군사는 바다를 건너기 어려워요. (실제로 고려는 1232년 강화도로 도읍을 옮겨 오랫동안 몽골에 맞섰고, 이때 팔만대장경을 새겼어요.)",
      choices: () => [
        C("육지를 계속 공격해 항복을 받아 낸다", () => R({ def: -8, ppl: -4, kp: 3, gold: 4 }, "육지의 마을들이 큰 피해를 입었지만, 바다 건너 섬은 끝내 무너지지 않았어요.", [0.6, 0.9, -0.3])),
        C("태자를 보내면 군대를 물리겠다고 화친한다", () => R({ gold: 3, har: 3, def: 2 }, "고려의 태자가 찾아와 화친을 맺었어요(1259년 고려와 몽골의 강화처럼). 고려는 나라를 지켰어요.", [-0.4, 0.2, 0])),
        C("공격을 멈추고 바닷길 무역을 연다", () => { addInc(1); return R({ gold: 4, cul: 4, def: -2 }, "고려의 종이와 인삼, 초원의 말과 은이 오가기 시작했어요.", [-0.3, -0.3, 0.3]); }),
      ] },
    // ---------- 세계사: 혁명 전야의 왕국 (프랑스) ----------
    h1: { h: "債", title: "텅 빈 왕실 금고", text: () => "다른 나라의 전쟁을 돕고 궁전에서 잔치를 벌이느라 왕실 금고가 텅 비었어요. 빌린 돈의 이자만 해도 나라 수입의 절반이나 돼요.",
      choices: () => [
        C("귀족과 성직자에게도 세금을 걷는다", () => R({ gold: 14, har: -12 }, "귀족들이 '수백 년 동안 세금을 낸 적이 없다!'며 크게 반발했어요.", [0.5, 0, 0.5])),
        C("은행가에게 또 돈을 빌린다", () => { S.flags.debt = true; return R({ gold: 10, kp: -4 }, "급한 불은 껐지만 갚아야 할 빚이 더 늘었어요. 앞으로 매 시기 이자를 내야 해요.", [-0.3, 0, -0.2]); }, "매 시기 이자로 재정 −2가 생겨요."),
        C("궁전의 잔치와 사치부터 줄인다", () => R({ gold: 6, ppl: 6, kp: -3, har: -2 }, "왕비의 화려한 옷과 잔치가 줄자, 시민들은 '이제야 정신을 차렸다'고 말했어요.", [-0.2, 0, 0.6])),
      ] },
    h2: { h: "會", title: "삼부회가 열리다", text: () => "175년 만에 성직자·귀족·평민 대표가 함께 모이는 회의(삼부회)가 열렸어요. 평민 대표들은 '신분마다 한 표가 아니라, 사람 수대로 표를 세자!'고 외쳐요.",
      choices: () => [
        C("전통대로 신분마다 한 표씩 센다", () => R({ har: 6, ppl: -10, kp: 2 }, "귀족과 성직자가 늘 이기자, 평민 대표들은 테니스장에 모여 '헌법을 만들 때까지 흩어지지 않겠다'고 맹세했어요(테니스코트의 서약).", [0.3, 0, -0.6])),
        C("사람 수대로 표를 센다", () => R({ ppl: 10, har: -10, kp: -2 }, "평민 대표들이 환호했어요. 귀족들은 왕이 자기들을 버렸다며 분노했어요.", [-0.4, 0, 0.8])),
        C("회의장 문을 닫고 회의를 멈춘다", () => { tyrUp(1); return R({ kp: 4, ppl: -12 }, "문이 잠기자, 분노한 시민들 사이에 '왕을 믿을 수 없다'는 말이 퍼졌어요.", [0.9, 0, -0.5]); }),
      ] },
    h3: { h: "獄", title: "바스티유가 무너지다", base: () => ({ kp: -4 }), text: () => "빵값에 분노한 파리 시민들이 무기를 찾아 오래된 감옥 요새(바스티유)로 몰려가 무너뜨렸어요(1789년 7월 14일). 나라 곳곳에서 농민들이 들고일어나고 있어요.",
      choices: () => [
        C("군대를 보내 시민들을 막는다", () => { tyrUp(1); return S.st.def >= 55 ? R({ kp: 4, ppl: -10, def: -6 }, "군대가 파리를 둘러쌌지만 시민들의 분노는 더 커졌어요.", [0.9, 0.6, -0.6]) : R({ def: -8, kp: -8, ppl: -8 }, "군인들까지 시민 편에 서 버렸어요! 왕의 명령을 따르는 군대가 줄었어요.", [0.9, 0.6, -0.6], { ok: false }); }, "국방이 55보다 낮으면 군대가 따르지 않을 수 있어요."),
        C("시민 대표의 '인권 선언'을 받아들인다", () => { S.flags.rights = true; return R({ ppl: 14, kp: -8, har: -4 }, "'사람은 태어날 때부터 자유롭고 평등하다.' 왕이 인권 선언을 받아들이자 파리가 환호로 가득 찼어요.", [-0.7, -0.3, 0.9]); }),
        C("몰래 외국으로 빠져나갈 준비를 한다", () => { S.flags.fled = true; return R({ kp: -10, ppl: -10 }, "변장한 왕의 마차가 국경 근처에서 붙잡혔어요(바렌 도주 사건처럼). 시민들은 왕이 나라를 버리려 했다며 분노했어요.", [-0.2, 0, -0.6], { ok: false }); }),
      ] },
    h4: { h: "戰", title: "왕을 지키겠다는 이웃 나라들", base: () => ({ gold: -4 }), text: () => `이웃 왕국들(오스트리아·프로이센)이 '혁명이 우리 나라로 번지면 안 된다'며 군대를 보냈어요. 적의 힘은 약 ${enemyPow()}, 우리 힘은 약 ${numIe(myPow())}.${S.flags.rights ? " 인권 선언을 받아들인 덕분에 시민들이 스스로 나라를 지키겠다고 나서고 있어요." : ""}`,
      choices: () => [
        C("시민군과 함께 맞서 싸운다", () => { const m = myPow() + (S.flags.rights ? 10 : 0), e = enemyPow(); if (m >= e) { S.flags.warWon = true; return R({ def: 6, ppl: 8, kp: 3 }, `'시민이여, 무기를 들어라!' 노래(라 마르세예즈)를 부르며 싸운 시민군이 적을 물리쳤어요(발미 전투처럼). 우리 ${m} : 적 ${e}`, [0.2, 0.9, 0.5]); } S.flags.warLost = true; return R({ def: -12, ppl: -8, kp: -6 }, `적군이 국경을 넘어 밀려왔어요. 우리 ${m} : 적 ${e}`, [0.2, 0.9, 0.5], { ok: false }); }, "인권 선언을 받아들였다면 우리 힘에 10을 더해요."),
        C("이웃 나라 군대에 몰래 기대어 왕권을 되찾는다", () => { tyrUp(2); S.flags.traitor = true; return R({ kp: 4, ppl: -16, def: -4 }, "왕이 적과 몰래 편지를 주고받은 사실이 드러나 시민들이 크게 분노했어요(루이 16세의 비밀 금고 편지처럼).", [0.8, 0.3, -0.8]); }),
        C("많은 재물을 주고 전쟁을 멈춘다", () => R({ gold: -10, kp: -3 }, "재물을 주고 전쟁을 멈췄지만, 텅 빈 금고가 더 비었어요.", [-0.5, -0.3, 0.3]), "곳간이 크게 줄어요."),
      ] },
    h6: { h: "將", title: "떠오르는 젊은 장군", text: () => "작은 섬 출신의 젊은 장교가 전투마다 이기며 시민들의 영웅이 되었어요. 그가 더 큰 군대를 맡겨 달라고 해요.",
      choices: () => [
        C("큰 군대를 맡긴다", () => { S.flags.napoleon = true; return R({ def: 12, kp: -3 }, "장군이 이끄는 군대가 연전연승했어요. 시민들은 왕보다 장군의 이름을 더 크게 외치기 시작했어요.", [-0.5, 0.9, 0]); }),
        C("상을 주되 군대는 나누어 맡긴다", () => R({ def: 6, kp: 2 }, "장군의 힘이 너무 커지지 않게 조심했어요.", [0.3, 0.5, 0])),
        C("위험한 인물이라며 먼 곳으로 보낸다", () => R({ kp: 4, def: -5, ppl: -3 }, "영웅을 먼 곳으로 보내자 시민과 군인들이 실망했어요.", [0.8, 0, -0.3])),
      ] },
    h7: { h: "變", title: "장군이 의회를 둘러싸다", text: () => "군대를 이끌던 장군이 의회를 둘러싸고 '내가 나라를 구하겠다'고 외쳤어요(1799년 브뤼메르 18일 쿠데타처럼).",

  function warChoices(jeongyu) {
    return [
      C("들판으로 나가 맞서 싸운다", () => { const m = myPow(), e = enemyPow(); if (m >= e) { S.flags.bigWin = true; S.flags.warWon = true; return R({ def: 5, kp: 8, ppl: 6 }, jeongyu ? `바다와 땅에서 모두 적을 몰아냈어요(명량·노량 해전처럼)! 우리 ${m} : 적 ${e}` : `큰 승리를 거두었어요${WORLD() ? "" : "(살수 대첩처럼)"}! 우리 ${m} : 적 ${e}`, [0.5, 1, 0]); } S.flags.warLost = true; return R({ def: -14, ppl: -10, gold: -8 }, `들판 싸움에서 크게 졌어요. 우리 ${m} : 적 ${e}. 많은 마을이 짓밟혔어요.`, [0.5, 1, 0], { ok: false }); }, "우리 힘이 적보다 크면 이겨요."),
      C("성에 들어가 끝까지 버틴다", () => { const m = myPow() + 12, e = enemyPow(); if (m >= e) { S.flags.warWon = true; return R({ def: 3, ppl: -3, kp: 4 }, `성을 지켜 냈어요${WORLD() ? "" : "(안시성 싸움처럼)"}. 우리 ${m} : 적 ${e}. 적은 지쳐 돌아갔어요.`, [0.2, 0.7, 0.2]); } S.flags.warLost = true; return R({ def: -10, ppl: -8, gold: -8 }, `성이 무너졌어요. 우리 ${m} : 적 ${e}.`, [0.2, 0.7, 0.2], { ok: false }); }, "성 안에서는 우리 힘에 12를 더해요."),
      C("많은 재물을 주고 화친한다", () => R({ gold: -15, kp: -6, ppl: S.st.gold < 15 ? -6 : -2 }, "많은 재물을 주고 전쟁을 끝냈어요. 백성은 덜 다쳤지만 나라의 자존심이 상했어요.", [-0.6, -0.3, 0.4]), "싸우지 않지만 곳간과 왕의 체면이 줄어요."),
    ];
  }
  function myPow() { return S.st.def + (has("fortress") ? 8 : 0) + (S.flags.ally || has("alliance") ? 10 : 0) + (has("hwarang") ? 5 : 0) + (S.flags.militia ? 6 : 0) + Math.round(S.st.kp * 0.1); }
  function enemyPow() {
    if (S.scen === "E") return 64 - (S.flags.admiral ? 12 : 0);
    if (S.scen === "F") return 74 - (S.flags.talk ? 6 : 0);
    if (S.scen === "G" || S.scen === "H") return 66;
    if (ENEMY5[S.scen]) return ENEMY5[S.scen]();
    return 62 + (S.flags.conquered ? 8 : 0) + (S.scen === "D" ? 10 : 0) + (S.scen === "B" ? 2 : 0);
  }
  const POOL = ["famine", "plague", "harvest", "goldmine", "merchants", "palace", "pirates", "luxury", "general", "talent", "envoy", "comet", "castaway", "drum", "tiger", "bribe", "spy", "maskdance"];
  function pickEvent() {
    const t = S.turn, u = (id) => S.used.includes(id);
    if (t > 10) return extEvent();
    if (SCRIPT5[S.scen]) { const x = SCRIPT5[S.scen](t); if (x) return x; }
    if (t === TURNS) return "heir";
    if (t === 1) return { E: "e1", F: "f1", G: "g1", H: "h1" }[S.scen] || "open" + S.scen;
    if (S.scen === "E" && t <= 6) return ["e1", "e2", "e3", "e4", "e5", "e6"][t - 1];
    if (S.scen === "F") { if (t === 3) return "f3"; if (t === 4) return "f4"; if (t === 5 && S.flags.hostage) return "f5"; }
    if (S.scen === "G") { const g = { 2: "g2", 3: "g3", 5: "g5", 7: "g7", 8: "dzud", 9: "g9" }[t]; if (g) return g; }
    if (S.scen === "H") { const h = { 2: "h2", 3: "h3", 4: "h4", 6: "h6", 9: "h9" }[t]; if (h) return h; if (t === 7 && S.flags.napoleon && S.st.kp < 60) return "h7"; }
    if (!"EFGH".includes(S.scen) && !(SCEN[S.scen] && SCEN[S.scen].noInv) && t === 5) return "invasion";
    if (t === 8) return pickDisaster();
    return freeEvent();
  }
  function freeEvent() {
    const t = S.turn, u = (id) => S.used.includes(id);
    // 위기 사건: 가장 위험한(낮은) 능력치부터
    const crisis = [["ppl", 22, "revolt"], ["gold", 16, "empty"], ["def", 20, "breach"], ["kp", 20, "weakking"], ["har", 22, "rebel"]]
      .filter(([k, lim, id]) => S.st[k] < lim && !u(id)).sort((a, b) => S.st[a[0]] - S.st[b[0]]);
    if (crisis.length) return crisis[0][2];
    if (S.flags.rebelRisk && !u("rebel")) { S.flags.rebelRisk = false; return "rebel"; }
    if (S.st.kp >= 70 && S.st.har <= 25 && S.tyr >= 3 && !u("plot")) return "plot";
    if (has("marriage") && !has("purge") && t >= 3 && !u("inlaw")) return "inlaw";
    if (S.flags.petition && !u("petition")) return "petition";
    if (!tried("buddhism") && t <= 4 && !u("monk") && !"EFHJKLMTUV".includes(S.scen) && Math.random() < 0.4) return "monk";
    const pool = POOL.filter((x) => !u(x) && poolOk(x) && !(S.scen === "G" && x === "pirates"));
    // 지난 판들에서 덜 본 사건이 더 자주 나와요
    return pool.length ? wpick(pool, (x) => recentW(x) / (1 + 0.8 * (SEEN.ev[x] || 0))) : "harvest";
  }

  // ================= 더 넓어진 사건들: 판마다 다른 선택지 =================
  // pick: 이 사건에서 보여 줄 선택지 수. 안 골라 본 선택지가 더 자주 나와요.
  // 같은 '정답'이 늘 통하지 않도록, 나라 형편과 되풀이 횟수에 따라 결과가 달라져요.
  const SR = (d, text, tags, sl, more) => R(d, text, tags, Object.assign({ sl }, more || {}));
  const FAILX = { ok: false };
  // 검소하게 살기: 처음엔 감동, 되풀이하면 시큰둥, 화려한 궁궐을 지었다면 역효과
  function frugal(base, firstText) {
    const n = again("frugal");
    if (S.flags.bigpalace) return SR({ ppl: -4, har: -2, kp: -2 }, "화려한 궁궐을 지은 왕이 검소하게 살겠다니! 백성들이 '말만 그럴듯하다'며 코웃음 쳤어요.", [-0.2, 0, 0.3], "왕이 검소하게 살겠다 하였으나, 새 궁궐 기와가 번쩍여 아무도 믿지 않았다.", FAILX);
    if (n >= 2) return SR({ gold: 2, kp: -3 }, "또 검소하게 살겠다는 말에 이제는 아무도 감동하지 않았어요. 신하들은 '왕실 체면이 말이 아니다'라며 수군거렸어요.", [-0.2, 0, 0.3], "왕이 또 허리띠를 졸랐다. 이번엔 허리띠가 끊어졌다 하더라.", FAILX);
    if (n === 1) return SR({ gold: Math.ceil((base.gold || 0) / 2), ppl: 1, kp: -2 }, "두 번째로 아끼자 감동은 처음보다 덜했어요.", [-0.2, 0, 0.4], "왕이 다시 반찬을 줄였다. 수라간 상궁이 이번엔 울지 않았다.");
    if (S.st.kp < 35) return SR({ gold: base.gold || 0, ppl: 2, kp: -4, har: -2 }, "왕의 힘이 약한 때라, 귀족들은 '왕이 가난해서 저런다'며 따라 하지 않았어요.", [-0.3, 0, 0.4], "왕이 검소하게 살자 귀족들이 '돈이 없어 그렇다'며 수군거렸다.", FAILX);
    return SR(base, firstText, [-0.2, 0, 0.5], null);
  }

  // ---------- 첫 사건: 선택지를 6개로 늘리고 4개씩 보여 줘요 ----------
  EV.openA.pick = 4;

  ]; }
  EV.openB.pick = 4;
  { const old = EV.openB.choices; EV.openB.choices = () => [...old(),

  EV.drum = { h: "鼓", title: "억울한 백성의 북소리", kr: true, pick: 4, text: () => "궁궐 앞에서 한 농부가 '억울합니다!' 하고 외쳐요. 고을 관리가 세금을 몰래 더 걷어 자기 주머니에 넣었다고 해요.",

  EV.tiger = { h: "虎", title: "마을에 내려온 호랑이", kr: true, pick: 4, text: () => "산에서 내려온 호랑이가 밤마다 마을의 소와 돼지를 물어 가요. 사람들이 무서워 밭에 나가지 못해요.",

    }
  }
  function portrait(k, cls) {
    const p = k.pt, uid = k.id + Math.floor(Math.random() * 1e6);
    const skin = p.female ? "#F6E1CF" : "#F1D0AE", skinS = "#D9A982", ink = "#2A1D17";

    const hair = p.hairColor || (p.white ? "#E9E5DB" : "#2A1D17");

    const joseon = p.hat === "ikseon";
    const chars = [...k.hz];

      ? `<circle cx="158" cy="52" r="11" fill="#C8332B"/><circle cx="62" cy="52" r="10" fill="#FBF8F0" stroke="#D8CDB4"/>

      : k.world

        : `${[[40, 70], [150, 90], [60, 150], [150, 160]].map(([x, y]) => `<path d="M${x} ${y} q6 -8 14 -2 q6 -8 14 0 q8 2 4 8 h-30 q-6 -2 -2 -6z" fill="#E2D2B0" opacity=".7"/>`).join("")}`;
    const browC = light ? "#9A9488" : p.hairColor && !p.female ? shade(p.hairColor, -0.2) : ink;
    const brow = p.female
      ? `<path d="M86 106 q5 -3 10 -1 M104 105 q5 -2 10 1" stroke="${shade(hair, -0.2)}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
      : p.brow === "fierce"
        ? `<path d="M83 103 L96 108 M117 103 L104 108" stroke="${browC}" stroke-width="3.4" stroke-linecap="round"/>`
        : `<path d="M84 106 q6 -4 12 -1 M104 105 q6 -3 12 1" stroke="${browC}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    const eyes = p.smile
      ? `<path d="M86 116 q5 -4 10 0 M104 116 q5 -4 10 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
      : `<path d="M86 115 q5 -2.5 10 0 M104 115 q5 -2.5 10 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="91" cy="115.5" r="1.6" fill="${ink}"/><circle cx="109" cy="115.5" r="1.6" fill="${ink}"/>${p.female ? `<path d="M85 113 l-2 -2 M115 113 l2 -2" stroke="${ink}" stroke-width="1.2"/>` : ""}`;
    const mouth = p.female ? `<path d="M95 135 q5 3 10 0 q-5 -2 -10 0 Z" fill="#C0392B"/>`
      : p.frown ? `<path d="M93 137 q7 -4 14 0" stroke="#8A3A2A" stroke-width="2" fill="none" stroke-linecap="round"/>`
        : p.smile ? `<path d="M93 135 q7 5 14 0" stroke="#8A3A2A" stroke-width="2" fill="none" stroke-linecap="round"/>`
          : `<path d="M94 136 q6 1.5 12 0" stroke="#8A3A2A" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    const dragon = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#D9A93A" stroke="#8A5A12" stroke-width="1.5"/><path d="M${cx - r * 0.5} ${cy + r * 0.2} q${r * 0.3} ${-r * 0.7} ${r * 0.7} ${-r * 0.3} t${r * 0.2} ${r * 0.6} q${-r * 0.4} ${r * 0.4} ${-r * 0.7} 0" stroke="#8A5A12" stroke-width="1.4" fill="none"/><circle cx="${cx + r * 0.35}" cy="${cy - r * 0.45}" r="${r * 0.12}" fill="#B3261E"/>`;
    const robeDeco = joseon ? dragon(100, 205, 15) + dragon(57, 190, 9) + dragon(143, 190, 9)
      : p.deco === "lis" ? [[64, 214], [80, 204], [120, 204], [136, 214], [100, 238], [70, 240], [130, 240]].map(([x, y]) => `<path d="M${x} ${y - 5} q-3 4 0 8 q3 -4 0 -8 M${x - 4} ${y} q2 -1 4 2 q2 -3 4 -2" stroke="#E2B33C" stroke-width="1.4" fill="none"/>`).join("")
        : `<path d="M44 215 Q100 205 156 215" stroke="${shade(robe, 0.25)}" stroke-width="3" fill="none"/>`;
    const armor = p.armor ? `<g fill="none" stroke="#C9A227" stroke-width="1.3">${[176, 186, 196].map((y, j) => [0, 1, 2, 3].map((i) => `<path d="M${46 + i * 8 + j * 2} ${y} q4 5 8 0 M${122 + i * 8 - j * 2} ${y} q4 5 8 0"/>`).join("")).join("")}</g>` : "";
    const sideburn = p.female || p.hair === "wig" || p.hair === "curly" ? "" : `<path d="M76.5 98 Q75 112 78 121 M123.5 98 Q125 112 122 121" stroke="${hair}" stroke-width="4" fill="none"/>`;
    const belt = p.belt === false ? "" : `<rect x="50" y="232" width="100" height="8" rx="3" fill="#C9A227"/>${[60, 76, 92, 108, 124, 140].map((x) => `<rect x="${x}" y="233.5" width="6" height="5" rx="1" fill="#F4EBD5" opacity=".8"/>`).join("")}`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" width="200" height="270" class="portrait ${cls || ""}" role="img" aria-label="${esc(k.n)}의 모습을 상상해 그린 어진풍 그림">
      <defs><linearGradient id="silk${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7EDD6"/><stop offset="1" stop-color="#E6D2AC"/></linearGradient></defs>
      <rect x="6" y="9" width="188" height="252" rx="2" fill="#6E4A2A"/>
      <rect x="14" y="17" width="172" height="236" fill="url(#silk${uid})"/>
      <g opacity=".95">${bg}</g>
      <path d="M26 252 C28 196 52 170 80 161 L120 161 C148 170 172 196 174 252 Z" fill="${robe}"/>
      ${robeDeco}${armor}${belt}
      <path d="M48 253 Q66 222 100 226 Q134 222 152 253 Z" fill="${dark}"/>
      <rect x="91" y="140" width="18" height="24" fill="${skinS}"/>
      ${collarSVG(joseon ? { ...p, collar: "joseon" } : p, robe, dark)}

      <circle cx="86" cy="127" r="5" fill="#E88A7A" opacity="${p.female ? 0.35 : 0.22}"/><circle cx="114" cy="127" r="5" fill="#E88A7A" opacity="${p.female ? 0.35 : 0.22}"/>

      <rect x="0" y="0" width="200" height="12" rx="6" fill="#4A2F1A"/><rect x="0" y="258" width="200" height="12" rx="6" fill="#4A2F1A"/>
      <circle cx="4" cy="6" r="5" fill="#C9A227"/><circle cx="196" cy="6" r="5" fill="#C9A227"/><circle cx="4" cy="264" r="5" fill="#C9A227"/><circle cx="196" cy="264" r="5" fill="#C9A227"/>

  }

  // ================= 과장된 실록 =================
  // 사건 선택지마다 한 줄. [잘됐을 때, 안됐을 때]로 나뉜 것도 있어요.
  const SL_EV = {
    openA: ["왕이 호족들의 잔치에 나아가 술잔을 아홉 번이나 비웠다. 호족들이 감격하여 '우리 왕은 술도 세다'며 무릎을 쳤다 하더라.", "왕이 호족들을 궁으로 불러 충성을 맹세하게 하니, 호족들이 입으로는 '충성!'을 외쳤으나 발가락은 꼼지락거렸다.", "왕이 잔치 비용을 호족들에게 떠넘기니, 호족들의 지갑은 홀쭉해지고 얼굴은 퉁퉁 부었다.", ["왕이 호족들과 활쏘기 내기를 하니, 화살이 과녁 한가운데를 꿰뚫었다. 호족들이 활을 내려놓고 박수를 쳤다.", "왕이 호족들과 활쏘기 내기를 하였다. 화살이 과녁 대신 지나가던 닭의 꽁지를 스치니 호족들이 배를 잡고 웃었다."]],
    openB: ["왕이 성문을 굳게 닫으라 명하였다. 성문이 어찌나 단단한지 적군이 문 앞에서 노크만 하다 돌아갔다.", "왕이 이웃 나라에 비단과 꿀단지를 보냈다. 적장이 꿀을 맛보고는 군대를 돌렸다 하니, 꿀의 힘이 칼보다 셌다.", "왕이 국경에 장터를 열었다. 어제까지 창을 겨누던 병사들이 오늘은 떡을 사고팔았다.", ["왕이 첩자를 보냈다. 첩자가 적장의 작전 두루마리를 통째로 들고 돌아오니 왕이 무릎을 쳤다.", "왕이 첩자를 보냈다. 첩자가 적진에서 떡을 훔쳐 먹다 붙잡혀 떡고물만 잔뜩 묻히고 돌아왔다."]],
    openC: ["왕이 한쪽 편 신하들의 손을 번쩍 들어 주었다. 다른 편 신하들은 그날 밤 이불을 걷어차며 잠들지 못하였다.", "왕이 두 편 신하를 한 상에 앉혀 밥을 먹게 하였다. 서로 눈도 마주치지 않고 밥만 세 그릇씩 비웠다.", "왕이 '싸움은 너희끼리 하라' 하고 백성 마을로 나갔다. 신하들은 왕이 없는 줄도 모르고 계속 싸웠다.", ["두 편 신하가 밤새 토론 대결을 벌였다. 진 편이 '졌소이다' 하고 깨끗이 물러나니 조정이 조용해졌다.", "두 편 신하가 토론 대결을 벌이다 말싸움이 되었다. 붓과 벼루가 날아다녀 사관이 책상 밑에 숨었다."]],
    openD: ["왕이 군대를 사열하니 병사들의 함성이 이웃 나라 궁궐 지붕까지 들썩이게 하였다.", "즉위 잔치가 사흘 밤낮 이어졌다. 부러진 상다리가 열세 개라 하더라.", "왕이 잔치 대신 장부를 펼쳤다. 신하들이 하품을 참느라 눈물을 흘렸으나 곳간은 든든해졌다.", ["왕이 즉위하자마자 이웃 나라 정복을 선포하였다. 이웃 나라 왕이 소식을 듣고 수라상을 엎었다 하더라.", "왕이 들뜬 마음에 원정을 떠났다가 크게 졌다. 물려받은 군대가 반으로 줄어 앞선 왕의 무덤 앞에서 왕이 고개를 들지 못하였다."]],
    e1: [["왕이 도읍 앞에 우뚝 서서 '한 걸음도 물러서지 않으리라!' 외치니, 왜군이 두 걸음 물러섰다.", "왕이 도읍을 지키겠다 큰소리쳤으나 군대가 탄금대에서 무너졌다. 왕의 큰소리만 메아리로 남았다."], "왕이 북쪽으로 피란길에 올랐다. 비가 억수같이 내려 왕의 신발 한 짝이 진흙에 영영 묻혔다 한다.", "왕의 교서가 방방곡곡에 붙었다. 서당 훈장님은 붓 대신 칼을, 스님은 목탁 대신 창을 들었다."],
    e2: ["왕이 바다의 장수를 믿고 수군을 맡겼다. 거북선이 나타나자 왜선들이 '거북이다!' 외치며 줄행랑쳤다.", ["왕이 적의 본거지를 치라 명하였다. 기적처럼 적의 배들이 불타니 바다가 사흘 동안 붉게 빛났다.", "왕이 무리하게 바다로 나가 싸우라 명하였다. 칠천량 앞바다에서 우리 배들이 가라앉으니, 왕이 사흘 동안 밥을 넘기지 못하였다."], "왕이 시기하는 신하들 말을 듣고 장수를 옥에 가두었다. 바다의 물고기들까지 혀를 끌끌 찼다 하더라."],
    e3: ["왕이 의병장들에게 벼슬을 내렸다. 붉은 옷의 곽재우 장군이 옷자락을 휘날리며 더욱 신나게 싸웠다.", "왕이 의병을 관군에 넣었다. 자유롭게 싸우던 의병들이 줄을 맞춰 걷느라 발이 꼬였다.", "왕이 의병장을 의심하여 감시하였다. 의병들이 '우리가 무슨 죄냐'며 내쉰 한숨에 깃발이 펄럭였다."],
    e4: ["조선군과 명군이 힘을 합쳐 평양성을 되찾았다. 기쁜 나머지 왕이 덩실덩실 춤을 추었다는 소문이 돌았다.", "왕이 명나라 군대에 군량만 대었다. 명나라 군사들이 밥을 어찌나 많이 먹던지 곳간 쥐들이 이사를 갔다.", ["백성과 군사가 행주산성을 지켜 냈다. 아낙네들이 앞치마로 돌을 날랐으니, 이것이 '행주치마'가 되었다는 이야기가 전한다.", "행주산성을 지키려 하였으나 힘이 모자랐다. 왕은 그날 밤 성벽 그림을 그리며 이를 갈았다."]],
    e5: [["바다와 들판에서 적을 몰아냈다. 명량 앞바다의 물살마저 우리 편을 들었다 하더라.", "들판 싸움에서 크게 졌다. 왕이 지도를 보며 '들판이 너무 넓었다'고 중얼거렸다."], ["성문을 굳게 닫고 버티니 적이 지쳐 돌아갔다. 성 안 사람들이 주먹밥을 하늘 높이 던지며 기뻐하였다.", "성이 무너졌다. 왕은 성을 더 높이 쌓지 않은 것을 두고두고 후회하였다."], "왕이 많은 재물을 주고 싸움을 멈추었다. 곳간 문을 열던 관리가 눈물을 훔쳤다."],
    e6: ["왕이 온 나라의 땅을 다시 쟀다. 숨어 있던 밭이 어찌나 많던지 측량하던 관리의 다리가 퉁퉁 부었다.", "왕이 세금을 크게 줄여 주었다. 살아남은 백성들이 다시 씨앗을 뿌리며 노래를 불렀다.", "왕이 나라를 지킨 장수와 의병에게 상을 내렸다. 상을 받은 늙은 의병이 기뻐서 사흘 밤을 새웠다."],
    f1: ["왕이 북쪽 나라와 형제가 되기로 하였다. 신하들이 '오랑캐와 형제라니!'라며 수염을 쥐어뜯었다.", "왕이 명나라 편에 서겠다 하니 신하들이 손뼉을 쳤다. 북쪽 나라 사신은 이를 갈며 돌아갔다.", "왕이 두 나라 사이에서 줄타기를 하였다. 신하들은 아슬아슬하여 손에 땀을 쥐었고, 상인들은 웃었다."],
    f3: ["왕이 청의 요구를 받아들였다. 선비들이 분하여 상투를 쥐고 마당을 뱅글뱅글 돌았다.", "'오랑캐의 신하가 될 수 없다!' 조정의 함성이 어찌나 컸던지 압록강 건너까지 들렸다 한다.", "왕이 시간을 끌며 협상하였다. 협상하던 신하의 입이 바짝 말라 물을 스무 사발이나 마셨다."],
    f4: [["남한산성에서 버티니 청군이 먼저 지쳐 물러갔다. 성 안 사람들이 언 손을 맞잡고 울었다.", "남한산성에서 47일을 버텼으나 식량이 떨어졌다. 왕이 삼전도에서 머리를 숙이니 그날 하늘도 잿빛이었다."], ["강화도로 건너가 버티니 청군이 바다 앞에서 발만 동동 굴렀다.", "청군이 배를 만들어 강화도를 건넜다. 바다를 믿었던 신하들이 할 말을 잃었다."], ["들판으로 나가 청군을 무찔렀다! 청나라 장수가 말에서 떨어져 엉덩방아를 찧었다 하더라.", "들판에서 크게 졌다. 왕은 '그래도 용감했다'며 스스로를 달랬다."]],
    f4s: ["왕이 공물을 바쳤다. 공물 수레가 어찌나 길던지 끝이 보이지 않았다.", ["신하들이 힘을 모아 협상하여 공물을 줄였다. 협상한 신하가 집에 가서 기절하듯 잠들었다.", "협상이 꼬여 오히려 공물이 늘었다. 협상한 신하는 그날 밤 이불 속에서 발차기를 하였다."], "왕이 겉으로는 공물을 바치고 몰래 군대를 길렀다. 병사들이 밤마다 소리 없이 활쏘기 연습을 하였다."],
    f5: ["왕이 세자에게 새 학문을 배워 오라 하였다. 세자가 보낸 편지에 '망원경'이라는 처음 보는 낱말이 적혀 있었다.", "왕이 큰돈을 바쳐 세자를 데려왔다. 세자가 돌아오던 날 왕은 체면도 잊고 버선발로 뛰어나갔다.", "왕이 복수를 다짐하며 군대를 길렀다. 활 쏘는 소리가 밤낮으로 그치지 않아 이웃 닭들이 잠을 설쳤다."],
    invasion: [["들판에서 적을 크게 무찔렀다! 적장이 투구를 거꾸로 쓰고 달아났다 하더라.", "들판 싸움에서 크게 졌다. 흙먼지 속에서 왕의 깃발만 겨우 돌아왔다."], ["성문을 닫고 버티니 적이 성벽만 쳐다보다 돌아갔다. 성 안 사람들이 남은 돌멩이를 기념품으로 나눠 가졌다.", "성이 무너졌다. 그날 이후 왕은 성벽 이야기만 나오면 고개를 돌렸다."], "왕이 많은 재물을 주고 싸움을 멈추었다. 적장이 재물을 세다가 손가락이 모자라 발가락까지 썼다."],
    disaster: ["왕이 나라 창고를 활짝 열었다. 쌀가마가 어찌나 많이 쏟아졌던지 창고지기가 깔릴 뻔하였다.", "왕이 부자와 양반에게 곡식을 내놓게 하였다. 부자들의 곳간에서 쌀가마가 굴러 나오니 부자들은 배가 아파 데굴데굴 굴렀다.", "왕이 이웃 나라에서 곡식을 사 왔다. 곡식 실은 배가 어찌나 무거웠던지 강물이 한 뼘 차올랐다.", "왕이 홍수에도 세금을 그대로 걷었다. 백성들의 원망 소리가 강물 소리보다 컸다."],
    famine: ["왕이 나라 창고를 열어 곡식을 나누었다. 굶던 아이가 밥을 세 그릇 먹고 배를 두드렸다.", "왕이 품삯을 주고 저수지를 쌓게 하였다. 백성은 밥을 얻고 나라는 저수지를 얻으니 개구리들도 이사 와서 기뻐하였다.", "왕이 가뭄에도 세금을 그대로 걷었다. 갈라진 논바닥처럼 민심도 쩍쩍 갈라졌다.", ["왕이 기우제를 올리자 마른하늘에 천둥이 치고 비가 쏟아졌다. 백성들이 빗속에서 덩실덩실 춤을 추었다.", "왕이 사흘 밤낮 기우제를 올렸으나 하늘은 맑기만 하였다. 제사상의 떡만 바짝 말라 갔다."]],
    plague: ["왕이 의원과 약을 보냈다. 의원들이 어찌나 바삐 돌았던지 짚신이 하루에 세 켤레씩 닳았다.", "왕이 병든 마을 입구를 막았다. 병은 덜 퍼졌으나 갇힌 마을 사람들은 담장 너머로 서운한 눈빛을 보냈다.", ["절과 사당마다 기도 소리가 울려 퍼졌다. 함께 기도하던 사람들이 서로 죽을 끓여 나누었다.", "기도를 올렸으나 병은 계속 번졌다. 스님이 목탁을 치다 졸았다는 소문이 돌았다."]],
    harvest: ["곳간마다 곡식이 넘쳤다. 쥐들이 기뻐 잔치를 벌였으나 고양이들이 더 기뻐하였다.", "왕이 남는 곡식을 이웃 나라에 팔았다. 돌아온 배에는 비단과 은이 가득하였다.", "왕이 풍년 든 해에 세금을 덜어 주니, 백성들이 왕의 이름을 넣어 노래를 지어 불렀다.", ["왕이 곡식을 배에 싣고 먼 나라로 보냈다. 배가 은과 비단을 산더미처럼 싣고 돌아와 항구가 들썩였다.", "곡식 실은 배가 폭풍을 만났다. 젖은 쌀이 바닷가에 밀려와 갈매기들만 배를 불렸다."]],
    goldmine: ["왕이 백성을 불러 은을 캐게 하였다. 곳간은 반짝였으나 광부들의 얼굴은 까맣게 그을렸다.", "왕이 백성에게 은을 캐게 하고 세금만 받았다. 은 캐는 마을마다 새 기와집이 올라갔다.", "왕이 '농사가 먼저'라며 은광을 닫았다. 은광 앞을 지나던 상인이 아까워서 발을 동동 굴렀다.", ["왕이 더 깊이 파라 명하니 땅속에서 은빛 강이 흘러나왔다. 광부들이 눈이 부셔 이마에 손을 얹었다.", "더 깊이 파던 광산 굴이 무너졌다. 일꾼들이 흙투성이가 되어 간신히 기어 나오며 왕을 원망하였다."]],
    merchants: ["왕이 장사를 허락하니 장터가 북적였다. 엿장수의 가위 소리가 궁궐 담장 너머까지 들렸다.", "왕이 허락받은 큰 상인만 장사하게 하였다. 큰 상인은 배가 불렀고 작은 상인은 배가 고팠다.", "왕이 상인들의 부탁을 물리쳤다. 상인들이 돌아가며 짚신을 질질 끌었다.", ["왕이 상인들과 바다 건너 큰 거래에 돈을 걸었다. 거래가 대박이 나서 상인들이 왕의 초상화를 가게마다 걸었다.", "왕이 큰 거래에 돈을 걸었으나 거래 상대가 돈을 떼먹고 사라졌다. 상인들이 빈 돈주머니를 흔들며 한숨을 쉬었다."]],
    palace: ["왕이 크고 화려한 궁궐을 지었다. 지붕이 어찌나 높던지 학이 지붕에 앉으려다 숨이 찼다 한다.", "왕이 낡은 곳만 고쳤다. 비가 새던 왕의 침실에서 드디어 양동이가 사라졌다.", "왕이 '궁궐은 지금도 충분하다' 하였다. 백성들 사이에 '우리 왕은 검소하다'는 칭찬이 자자하였다."],
    pirates: [["수군이 해적을 크게 무찔렀다. 해적들이 노를 거꾸로 저으며 도망쳤다.", "수군이 약해 해적을 놓쳤다. 해적들이 멀리서 혀를 내밀었다 하더라."], ["수군이 해적의 섬을 쳐서 빼앗긴 것을 되찾았다. 돌아오는 배마다 쌀과 사람이 가득하였다.", "바다를 건넜으나 큰 성과 없이 돌아왔다. 뱃멀미를 한 장수가 사흘을 누워 지냈다."], "왕이 정해진 항구에서만 장사를 허락하니 해적들이 상인으로 변신하였다. 칼 대신 저울을 든 해적이 어색해 보였다.", ["왕이 해적 두목을 수군 장수로 삼았다. 두목이 '이제부터 바다의 평화를 지키겠소!' 외치니 옛 부하들이 노를 떨어뜨렸다.", "왕이 해적 두목을 장수로 삼으려 했으나, 두목은 배와 보물을 챙겨 달아났다. 멀리서 두목이 손을 흔들었다 하더라."]],
    luxury: ["왕이 사치를 금지하고 벌금을 걷었다. 귀족들이 금비녀를 버선 속에 숨겼다가 들켰다.", "왕이 먼저 무명옷을 입고 나타나니, 비단옷을 입은 신하들이 슬그머니 겉옷을 벗었다.", "왕이 사치를 그냥 두었다. 귀족들의 잔칫상 다리가 부러질 때마다 백성들의 한숨이 늘었다."],
    general: ["왕이 영웅 장군에게 큰 군대를 맡겼다. 군사들이 '장군 만세!'를 외치니 왕의 귀가 살짝 간지러웠다.", "왕이 장군에게 상을 주되 군대는 나누어 맡겼다. 장군도 웃고 왕도 웃었으나 속마음은 아무도 몰랐다.", "왕이 영웅 장군을 먼 섬으로 보냈다. 백성들이 장군이 떠난 바닷가를 바라보며 훌쩍였다."],
    talent: ["왕이 신분이 낮은 천재에게 벼슬을 주었다. 그가 만든 물시계가 '땡' 하고 울리자 신하들의 입이 떡 벌어졌다.", "왕이 천재에게 상을 주고 돌려보냈다. 천재는 집에 가서 몰래 더 신기한 기계를 만들었다 하더라.", "왕이 신하들 뜻을 따라 천재를 돌려보냈다. 아까운 재주가 산골짜기에서 장작이나 패게 되었다.", ["천재가 만든 하늘을 나는 수레가 성벽 위를 훨훨 날았다. 구경하던 백성들의 입이 다물어지지 않았다.", "천재가 만든 날틀이 하늘로 솟구치더니 연못에 풍덩 빠졌다. 천재는 젖은 옷을 짜며 '다음엔 된다'고 외쳤다."]],
    envoy: ["왕이 큰 나라와 손을 잡았다. 큰 나라 사신이 어깨를 으쓱하며 돌아갔다.", "왕이 큰 나라의 제안을 정중히 거절하였다. 사신의 얼굴이 홍시처럼 붉어졌다.", "왕이 어느 편에도 서지 않고 장사만 하였다. 양쪽 사신이 모두 서운해하였으나 곳간은 웃었다."],
    monk: ["왕이 먼 나라의 승려를 맞아 새 종교를 받아들였다. 절 짓는 망치 소리가 온 나라에 울렸다.", "왕이 승려에게 약초 쓰는 법과 집 짓는 법만 배웠다. 승려가 '종교는 언제 받아들이시렵니까' 하고 매일 물었다.", "왕이 승려를 돌려보냈다. 옛 신을 모시던 무당들이 사흘 동안 굿을 하며 기뻐하였다."],
    inlaw: ["왕이 왕비의 친척들을 조정에서 몰아냈다. 그날 밤 왕비가 왕에게 등을 돌리고 잤다 한다.", "왕이 외척을 그냥 두었다. 외척들이 왕보다 큰 목소리로 명령을 내리기 시작하였다.", "왕이 외척을 중요한 자리에서만 슬쩍 물러나게 하였다. 외척들은 무엇이 바뀌었는지 한참 뒤에야 알아챘다."],
    petition: [["왕이 반대하는 신하들을 밤새 설득하였다. 새벽닭이 울 무렵 신하들이 고개를 끄덕였다.", "왕이 밤새 설득하였으나 신하들은 꿈쩍도 하지 않았다. 왕은 목이 쉬어 사흘 동안 손짓으로 말하였다."], "왕이 반대 상소를 올린 신하들을 옥에 가두었다. 그 뒤로 조정에서 '아니 되옵니다' 소리가 사라졌다.", "왕이 한발 물러섰다. 신하들은 기뻐 춤을 추었고 개혁 서류에는 먼지가 쌓였다."],
    rebel: [["왕이 군대를 보내 반란을 진압하였다. 반란군 대장이 말을 거꾸로 타고 달아났다 하더라.", "진압에 실패하였다. 왕이 뒷문으로 겨우 빠져나오다 갓을 잃어버렸다."], "왕이 반란군의 요구를 들어주었다. 반란군은 웃으며 돌아갔고 왕은 이불 속에서 분해하였다.", ["왕이 앞장선 몇 사람만 벌하니, 나머지 무리가 '성은이 망극하옵니다'를 외치며 흩어졌다.", "왕이 앞장선 사람만 벌하려 했으나 말이 먹히지 않았다. 반란이 장마처럼 길게 이어졌다."]],
    revolt: ["왕이 세금을 크게 깎아 주니, 농민들이 낫을 내려놓고 대신 떡을 들고 와 바쳤다.", ["왕이 군대를 보내 농민들을 흩어 놓았다. 조용해졌으나 마을마다 원망이 쌓였다.", "왕이 군대를 보냈으나 오히려 농민들에게 밀려났다. 병사들이 신발을 벗어 들고 달아났다."], "왕이 백성을 괴롭힌 탐관오리를 벌하고 재산을 거두었다. 탐관오리의 곳간에서 굴비가 천 마리나 나왔다."],
    empty: ["왕이 세금을 올렸다. 곳간은 찼으나 백성들의 지갑은 얇은 종잇장이 되었다.", "왕이 왕실 보물을 내놓았다. 왕비가 아끼던 노리개까지 나오니 신하들이 감동하여 콧물을 흘렸다.", "왕이 부자 귀족에게 돈을 빌렸다. 귀족들이 차용증을 품에 안고 히죽 웃었다.", "왕이 벼슬을 돈 받고 팔았다. 글자도 모르는 사또가 공문을 거꾸로 들고 읽었다 하더라.", ["왕이 나라 보물을 걸고 큰 장사판을 벌였다. 장사가 대박이 나서 곳간 문이 다시는 닫히지 않을 정도였다.", "왕이 나라 보물을 걸고 장사판을 벌였으나 쫄딱 망하였다. 곳간지기가 빈 보물 상자를 끌어안고 울었다."]],
    plot: ["왕이 몰래 모인 신하들을 모두 잡아들였다. 조정이 너무 조용해져 바늘 떨어지는 소리까지 들렸다.", "왕이 신하들을 불러 마음을 터놓았다. 수염 난 신하들이 서로 부둥켜안고 엉엉 울었다.", "왕이 소문을 모른 척하였다. 그사이 소문이 커져 시장 할머니들까지 알게 되었다."],
    heir: ["왕이 맏아들을 세자로 세웠다. 신하들이 '전통을 지키셨다'며 한목소리로 고개를 끄덕였다.", "왕이 가장 어진 아들을 세자로 세웠다. 맏아들은 서운했으나 사냥을 다니며 마음을 달랬다 한다.", ["왕이 외국 학문을 배운 세자에게 나라를 맡겼다. 세자가 가져온 시계가 똑딱거리자 신하들이 뒤로 넘어졌다.", "새 학문을 배워 온 세자가 갑자기 세상을 떠났다. 사관은 붓을 멈추고 한참을 말이 없었다."], ["왕이 세자를 엄하게 키웠다. 세자는 하루에 책을 열 권씩 읽고 단단한 왕으로 자랐다.", "엄한 가르침 끝에 아버지와 아들 사이에 큰 비극이 일어났다. 궁궐에 오래도록 무거운 침묵이 흘렀다."]],
    breach: ["왕이 마을마다 백성을 군사로 모았다. 어제까지 호미를 들던 손이라 창을 거꾸로 든 자도 있었다.", "왕이 곳간을 열어 성을 고쳤다. 새 성벽에 왕의 이름을 크게 새기려다 신하들이 말렸다.", "왕이 재물을 보내 적을 달랬다. 적군이 재물을 짊어지고 돌아가며 '또 오겠다'고 하였다."],
    weakking: ["왕이 믿을 만한 젊은 신하들을 모았다. 젊은 신하들이 어찌나 씩씩하게 대답하던지 기왓장이 흔들렸다.", "왕이 자기를 지키는 군대를 따로 만들었다. 신하들이 왕 앞을 지날 때마다 발소리를 죽였다.", "왕이 힘센 신하에게 나랏일을 맡겼다. 그 신하가 왕의 의자에 슬쩍 앉아 보다 들켰다 하더라."],
    g1: ["칸이 양치기 출신을 천인대장으로 삼았다. 옛 부족장들이 '양을 치던 자가!' 하며 말에서 굴러떨어졌다.", "칸이 부족장의 딸과 혼인하니 초원에서 이레 동안 잔치가 열렸다. 말젖술이 강을 이루었다 한다.", "칸이 따르지 않는 부족을 말발굽으로 굴복시켰다. 그 부족의 말들까지 고개를 숙였다."],
    g2: ["칸이 길마다 역참을 세웠다. 파발꾼이 어찌나 빨리 달렸던지 소문보다 편지가 먼저 도착하였다.", "칸이 '상인을 해치는 자는 엄벌한다'고 선포하였다. 도적들이 칼을 버리고 양을 치기 시작하였다.", "칸의 군사들이 상인을 털었다. 상인들이 초원을 피해 돌아가느라 낙타들이 투덜거렸다."],
    g3: [["칸이 복수의 원정에 나섰다. 몽골 기병이 바람보다 빨라 적의 성주가 신발도 못 신고 달아났다.", "먼 원정길에 군사들이 지쳐 크게 졌다. 말들도 고개를 숙이고 터벅터벅 돌아왔다."], ["칸이 다시 사신을 보냈다. 칸의 이름을 들은 성주가 보물 상자를 들고 맨발로 뛰어나왔다.", "다시 보낸 사신마저 쫓겨났다. 부족장들이 칸을 보며 헛기침을 하였다."], "칸이 분노를 꾹 참았다. 참느라 칸의 콧수염이 사흘 동안 바르르 떨렸다."],
    g5: [["칸의 군대가 세상 끝까지 달렸다. 서쪽 나라 사람들이 '말 탄 바람이 온다'며 문을 걸어 잠갔다.", "지친 군대가 낯선 땅에서 크게 졌다. 말들이 고향 초원 쪽만 바라보았다."], "칸이 정복한 땅마다 관리를 두었다. 관리들이 장부를 어찌나 많이 썼던지 붓이 모자랐다.", "칸이 넓은 땅을 아들들에게 나누어 주었다. 아들들이 서로 큰 땅을 받겠다고 지도를 잡아당겼다."],
    g7: ["칸이 학자와 기술자를 도읍으로 불렀다. 초원 한가운데서 천문학자와 대장장이가 한솥밥을 먹었다.", "칸이 학자와 기술자들을 고향으로 돌려보냈다. 그들이 고향에서 칸을 칭찬하는 시를 지었다.", "칸이 학자들을 가두었다. 감옥 안에서 학자들이 벽에 수학 문제를 빼곡히 적었다."],
    dzud: ["칸이 곳간을 열어 가축과 곡식을 나누었다. 얼어붙은 천막집마다 다시 연기가 피어올랐다.", "칸이 남쪽에서 곡식을 사 왔다. 낙타 행렬이 어찌나 길던지 맨 앞 낙타가 도착할 때 맨 뒤 낙타는 아직 출발도 안 했다.", "칸이 정복한 땅에서 세금을 더 거두었다. 정복지 사람들이 칸의 초상화에 몰래 콧수염을 하나 더 그려 넣었다."],
    g9: ["칸의 군대가 육지를 휩쓸었으나 강화도는 끝내 무너지지 않았다. 말들이 바다를 보며 '헤엄은 못 쳐요' 하는 눈빛을 보냈다.", "고려의 태자가 찾아와 화친을 맺었다. 칸이 태자의 의젓함에 감탄하여 술잔을 건넸다.", "칸이 고려와 바닷길 무역을 열었다. 초원 사람들이 처음 맛본 인삼에 눈이 번쩍 뜨였다."],
    h1: ["왕이 귀족과 성직자에게도 세금을 매겼다. 귀족들이 가발을 벗어 바닥에 패대기쳤다.", "왕이 은행가에게 또 돈을 빌렸다. 은행가가 장부에 동그라미를 하나 더 그리며 미소 지었다.", "왕이 궁전 잔치를 줄였다. 일거리를 잃은 잔치 요리사들이 빵집을 차렸다."],
    h2: ["왕이 신분마다 한 표씩 세게 하였다. 평민 대표들이 테니스장에 모여 땀을 뻘뻘 흘리며 맹세하였다.", "왕이 사람 수대로 표를 세게 하였다. 평민 대표들이 모자를 하늘 높이 던졌는데, 그중 하나가 귀족 머리에 떨어졌다.", "왕이 회의장 문을 잠갔다. 대표들이 문 앞에서 '열어라!'를 백 번 외쳤다."],
    h3: [["왕이 군대로 파리를 둘러쌌다. 시민들의 분노가 하늘을 찔러 구름까지 붉게 물들었다 하더라.", "왕이 군대를 보냈으나 군인들이 시민 편에 섰다. 장교가 칼을 든 채 어리둥절하게 서 있었다."], "왕이 인권 선언을 받아들였다. 파리 시민들이 서로 끌어안고 빵을 나누어 먹었다.", "왕이 변장을 하고 달아나다 국경 근처 마을에서 붙잡혔다. 지폐에 그려진 얼굴과 똑같아서 들켰다는 이야기가 전한다."],
    h4: [["시민군이 노래를 부르며 싸워 적을 물리쳤다. 그 노래는 훗날 나라의 노래가 되었다.", "적군이 국경을 넘어 밀려왔다. 시민군의 노랫소리가 점점 작아졌다."], "왕이 적과 몰래 편지를 주고받았다. 궁궐 벽 속 비밀 금고에서 편지 뭉치가 쏟아져 나오자 시민들이 기절초풍하였다.", "왕이 재물을 주고 전쟁을 멈추었다. 텅 빈 금고에 메아리만 울렸다."],
    h6: ["왕이 젊은 장군에게 큰 군대를 맡겼다. 장군의 모자가 어찌나 크던지 행진할 때마다 바람에 휘청거렸다.", "왕이 장군에게 상을 주고 군대는 나누어 맡겼다. 장군이 모자를 고쳐 쓰며 '알겠습니다' 하였다.", "왕이 장군을 먼 곳으로 보냈다. 장군은 떠나며 지도에 무언가를 열심히 그렸다 하더라."],
    h7: ["왕이 장군에게 나랏일을 맡겼다. 장군이 왕보다 먼저 회의장에 들어가 가운데 자리에 앉았다.", ["왕이 끝까지 맞서니 신하와 시민들이 왕 편에 섰다. 장군이 모자를 벗고 물러갔다.", "장군의 군대가 궁궐을 차지하였다. 왕은 이름만 남아 옥좌에 덩그러니 앉아 있었다."], "왕과 장군이 함께 다스렸다. 회의 때마다 누가 먼저 말할지 눈치 싸움이 벌어졌다."],
    h9: ["모든 시민이 법 앞에 평등한 법전이 완성되었다. 그 두께가 어찌나 두꺼운지 베개로 써도 될 정도였다.", "왕이 옛 신분 질서를 되돌렸다. 귀족들은 가발에 분을 다시 뿌렸고 시민들은 이를 갈았다.", "왕이 법을 천천히 고치기로 하였다. 회의가 어찌나 길었던지 참석자들의 수염이 한 뼘씩 자랐다."],
  };

    rank: "왕이 관리의 등급마다 옷 색을 정하였다. 그날부터 궁궐 마당이 무지개처럼 알록달록해졌다.",
    local: "왕이 지방마다 관리를 보냈다. 호족들이 새 관리를 보고 '어디서 굴러온 돌이냐'며 수군거렸다.",
    exam: "왕이 시험으로 관리를 뽑았다. 시험장에 붓 휘두르는 소리가 소나기처럼 쏟아졌다.",

    conquest: ["왕의 군대가 이웃 땅을 차지하였다. 새로 그린 지도가 어찌나 큰지 궁궐 벽에 다 걸리지 않았다.", "왕의 군대가 이웃 나라에 졌다. 돌아오는 군사들의 발걸음이 천근만근이었다."],

      choices: () => [
        C("돈을 받고 권리를 내준다", () => SR({ gold: 12, ppl: -6, def: -2 }, "곳간은 찼지만 우리 땅의 금과 나무가 외국으로 실려 나갔어요.", [0.2, 0, -0.5], "광산 권리를 팔고 받은 돈을 세니, 외국 상인은 금덩이를 세고 있었다.")),
        C("우리 힘으로 철도와 광산을 개발하겠다며 거절한다", () => SR({ kp: 5, gold: -6, cul: 3 }, "우리 손으로 철도 회사를 세웠지만, 돈과 기술이 모자라 일이 더뎠어요.", [0.6, 0, 0.2], "우리 철도를 놓겠다 하였으나, 기찻길보다 회의가 먼저 길어졌다.")),
        C("강대국들이 서로 견제하게 골고루 나눠 준다", () => SR({ gold: 6, def: 3, kp: -4 }, "어느 한 나라가 독차지하지 못하게 했어요. 하지만 우리 땅이 강대국들의 놀이터가 되었어요.", [-0.3, 0, 0], "강대국 사신들이 서로 견제하니, 궁궐 회의실에 의자가 모자랐다.")),
        GB("그 돈으로 신식 군대를 크게 키운다", 0.5, () => { S.done.push({ id: "jarmy", turn: S.turn, ok: true, by: "event" }); return SR({ def: 12, gold: 2 }, "외국 교관이 가르친 신식 군대가 늠름하게 행진했어요!", [0.4, 0.8, 0], "신식 군대가 행진하니, 구경하던 아이들이 막대기를 메고 뒤따라 행진하였다."); }, () => SR({ gold: -8, def: 2 }, "외국 교관이 돈만 받고 제대로 가르치지 않았어요.", [0.4, 0.8, 0], "외국 교관이 돈을 받고는 '내일부터 열심히'만 외치다 떠났다.", FAILX), "성공하면 '신식 군대 키우기'를 한 것과 같아요."),
      ] },
    j3: { h: "戰", title: "러일 전쟁", text: () => "만주와 한반도를 두고 러시아와 일본이 전쟁을 시작했어요(1904년). 대한 제국은 어느 편도 아니라고(중립) 선언했지만 일본군이 서울로 들어왔어요.",
      choices: () => [
        C("중립을 끝까지 지키며 세계에 알린다", () => { S.flags.protest = true; return SR({ kp: 3, cul: 2, def: -3 }, "세계에 중립을 알렸지만 강대국들은 귀 기울이지 않았어요. 그래도 우리의 뜻은 기록에 남았어요.", [0.2, -0.2, 0], "황제가 중립을 외치니, 세계 신문 한 귀퉁이에 작게 실렸다. 돋보기가 필요하였다."); }),
        C("일본 편에 서서 나라를 지켜 달라고 한다", () => { S.flags.proJapan = true; return SR({ def: 3, gold: 4, kp: -9, ppl: -7 }, "일본은 '도와주겠다'며 우리 땅을 마음대로 쓰게 하는 약속(한일 의정서)을 받아 냈어요. 사람들이 크게 분노했어요.", [-0.5, 0, -0.5], "일본 편에 서니, 일본이 고맙다며 우리 땅에 군대 막사를 세웠다.", FAILX); }, "당장은 편하지만 나중에 크게 불리해져요."),
        GB("러시아와 몰래 손을 잡는다", 0.25, () => SR({ def: 8, kp: 5 }, "역사와 달리 러시아가 이겼어요! 일본의 힘이 크게 줄었어요.", [0.3, 0.3, 0], "러시아가 이기니, 황제가 몰래 숨겨 둔 러시아 사전을 꺼내 들었다."), () => SR({ kp: -8, def: -6 }, "실제 역사처럼 일본이 이겼어요. 러시아와 손잡은 일이 드러나 일본의 압박이 더 심해졌어요.", [0.3, 0.3, 0], "러시아가 지니, 황제가 러시아 사전을 아궁이에 넣었다.", FAILX), "실제 역사에서는 일본이 이겼어요."),
        C("군대를 모아 스스로 지킬 준비를 한다", () => SR({ def: 7, gold: -8, ppl: 2 }, "군대를 늘리고 무기를 사들였어요. 곳간은 줄었지만 백성들이 든든해했어요.", [0.3, 0.7, 0], "군사를 모으니, 장터 대장장이가 사흘 밤낮 창을 두드렸다.")),
      ] },
    j4: { h: "恥", title: "을사늑약", base: () => ({ kp: -4 }), text: () => "1905년, 일본이 군대로 궁궐을 둘러싸고, 다른 나라와 약속을 맺는 권리(외교권)를 빼앗는 조약에 도장을 찍으라고 해요. 몇몇 대신은 이미 찬성했어요(을사오적)." + (S.flags.proJapan ? " 일본 편에 섰던 일 때문에 일본의 목소리가 더 커요." : ""),
      choices: () => [
        C("끝까지 도장을 찍지 않는다", () => { S.flags.refuse = true; return SR({ kp: 4, ppl: 6, def: -4 }, "황제는 끝까지 허락하지 않았어요. 그래서 이 조약은 강제로 맺은 것이라 무효라는 주장이 있어요. 하지만 일본은 대신들의 도장으로 조약을 밀어붙였어요.", [0.5, 0, 0.3], "황제가 도장을 숨기니, 일본 관리가 대신 도장을 찾아 궁궐을 사흘 동안 뒤졌다."); }),
        C("어쩔 수 없이 받아들인다", () => SR({ kp: -10, ppl: -10, gold: 4 }, "외교권을 빼앗겼어요. 사람들은 '나라를 팔았다'며 울분을 터뜨렸어요.", [-0.5, 0, -0.5], "조약을 받아들인 날, 궁궐 까마귀들이 일제히 울었다.", FAILX)),
        C("세계 여러 나라에 조약이 무효라고 알린다", () => { S.flags.protest = true; return SR({ cul: 4, kp: 3, gold: -5 }, "황제가 몰래 외국에 편지를 보내 '나는 허락하지 않았다'고 알렸어요(헐버트 같은 외국인 친구가 도왔어요).", [0.2, -0.3, 0.2], "황제의 비밀 편지가 바다를 건너니, 편지를 숨긴 외국인 선교사의 모자가 유난히 불룩하였다."); }),
        C("신문에 알려 백성과 함께 맞선다", () => { S.flags.militiaJ = true; return SR({ ppl: 8, def: 4, kp: -2 }, "'오늘 목 놓아 크게 우노라!(시일야방성대곡)' 신문 글이 퍼지자 전국에서 의병이 일어났어요.", [-0.2, 0.5, 0.8], "신문 글이 퍼지니, 읽는 사람마다 목 놓아 울어 신문이 다 젖었다."); }),
      ] },
    j5: { h: "使", title: "헤이그로 간 특사", text: () => "1907년, 네덜란드 헤이그에서 세계 여러 나라가 모이는 평화 회의가 열려요. 몰래 특사(이준·이상설·이위종)를 보내 을사늑약이 억지로 맺어졌다고 알릴까요?",
      choices: () => [
        GB("특사를 보낸다", Math.min(0.5, 0.2 + (S.flags.protest ? 0.15 : 0) + (S.st.cul >= 55 ? 0.1 : 0)), () => { S.flags.hague = true; S.flags.hagueOk = true; return SR({ kp: 6, cul: 6, ppl: 6 }, "특사들의 연설이 세계 신문에 크게 실렸어요! 여러 나라가 대한 제국의 억울함을 알게 되었어요.", [0.3, -0.4, 0.3], "특사의 연설이 세계 신문 첫 장에 실리니, 일본 관리가 신문을 거꾸로 들고 읽었다."); }, () => { S.flags.hague = true; return SR({ kp: -12, cul: 4, ppl: 5 }, "특사들은 회의장에 들어가지도 못했어요. 일본은 이를 핑계로 황제를 강제로 물러나게 했어요(1907년). 하지만 특사들의 외침은 신문을 통해 세계에 알려졌어요.", [0.3, -0.4, 0.3], "특사들이 회의장 문 앞에서 막히니, 이위종이 문밖에서 프랑스 말로 연설을 하였다. 기자들이 더 많이 모였다.", FAILX); }, "실제 역사에서는 회의장에 들어가지 못했어요. 을사늑약에 맞서 세계에 알렸다면 확률이 올라요."),
        C("일본의 눈치를 보며 조용히 힘을 기른다", () => SR({ gold: 4, def: 3, ppl: -5 }, "조용히 지내는 동안 일본은 군대를 해산시키고 경찰권까지 가져갔어요.", [-0.3, 0.3, -0.2], "황제가 조용히 지내니, 일본 통감이 더 시끄럽게 굴었다.")),
        C("해산된 군인들과 의병을 몰래 돕는다", () => { S.flags.militiaJ = true; return SR({ def: 8, gold: -8, kp: -2 }, "해산된 군인들이 의병과 합쳐 전국에서 일본군과 싸웠어요(정미의병).", [0.2, 0.8, 0.3], "해산된 군인들이 의병이 되니, 군복 위에 삿갓을 쓴 모습이 퍽 늠름하였다."); }),
        C("학교와 신문으로 사람들을 깨운다 (애국 계몽 운동)", () => SR({ cul: 8, ppl: 5, gold: -4 }, "곳곳에 학교가 세워지고 신문이 사람들을 깨웠어요(신민회·대한매일신보). '실력을 길러야 나라를 지킨다!'", [-0.2, -0.7, 0.5], "학교가 곳곳에 서니, 할아버지들까지 손자 옆에 앉아 '가갸거겨'를 외웠다.")),
      ] },
    j6: { h: "國", title: "나라를 빼앗길 위기", text: () => `1910년 8월, 일본이 대한 제국을 완전히 빼앗는 조약을 밀어붙이고 있어요. 우리 나라의 힘은 약 ${jPow()}이에요. 역사 속에서는 이 힘이 모자라 나라를 빼앗겼어요(경술국치).`,
      choices: () => [
        GB("온 나라가 함께 일어나 끝까지 맞선다", Math.max(0.03, Math.min(0.35, (jPow() - 38) / 90)), () => { S.flags.kept = true; return SR({ kp: 10, def: 6, ppl: 10 }, "역사와 다른 기적이 일어났어요! 온 나라 사람들이 한꺼번에 들고일어나자 세계 여러 나라가 대한 제국 편을 들었고, 일본은 물러설 수밖에 없었어요.", [0.3, 0.8, 0.6], "온 백성이 들고일어나니, 일본 관리가 들고 온 조약 문서가 바람에 날려 한강에 떨어졌다."); }, () => loseNation({ def: -10, ppl: 4, kp: -6 }, "온 힘을 다해 맞섰지만 일본의 군대를 막지 못했어요. 1910년 8월 29일, 나라를 빼앗겼어요(경술국치).", "황제가 끝까지 맞섰으나 나라를 잃었다. 사관이 붓을 꺾으려다, 다시 쥐었다."), "우리 나라의 힘이 클수록 확률이 올라요(최대 35%)."),
        C("나라를 잃더라도 백성의 목숨부터 지킨다", () => loseNation({ kp: -10, ppl: -4, gold: -2 }, "피를 흘리지 않았지만 나라를 빼앗겼어요(경술국치).", "황제가 백성의 목숨을 택하였다. 그날 밤 궁궐의 등불이 하나둘 꺼졌다.")),
        C("나라 밖으로 나가 독립운동을 이끌 준비를 한다", () => loseNation({ kp: -5, gold: -6, har: 6 }, "많은 지도자들이 만주와 연해주, 상하이로 떠나 독립운동을 이어 갈 준비를 했어요. 나라는 빼앗겼어요(경술국치).", "지도자들이 압록강을 건너니, 강물이 그 발자국을 오래도록 기억하였다.")),
        C("의병과 함께 산으로 들어가 싸움을 이어 간다", () => loseNation({ def: 6, ppl: 4, kp: -7, gold: -6 }, "의병들이 산으로 들어가 끝까지 싸웠어요. 나라는 빼앗겼지만 싸움은 끝나지 않았어요(경술국치).", "의병들이 산으로 들어가니, 산속 호랑이도 길을 비켜 주었다 하더라.")),
      ] },
    j7: { h: "萬", title: "3·1 운동", text: () => "1919년 3월 1일, 독립 선언서가 낭독되고 온 나라 사람들이 태극기를 들고 '대한 독립 만세!'를 외쳤어요. 학생, 농민, 상인, 어린이까지 함께했어요(유관순처럼). 일본 경찰과 군대가 총칼로 막고 있어요.",
      choices: () => [
        C("만세 운동을 온 나라로 넓힌다", () => SR({ ppl: 12, har: 6, def: -5 }, "만세 소리가 마을에서 마을로, 나라 밖 동포들에게까지 퍼졌어요. 많은 사람이 다치고 붙잡혔지만 독립의 뜻은 꺾이지 않았어요.", [-0.3, 0, 0.9], "만세 소리가 어찌나 컸던지 일본 경찰이 귀를 막고도 다 들었다.")),
        C("세계 여러 나라에 만세 운동을 알린다", () => SR({ cul: 5, kp: 4, gold: -4 }, "외국인 의사 스코필드 박사 같은 사람들이 사진과 글로 일본의 탄압을 세계에 알렸어요.", [0.2, -0.4, 0.3], "스코필드 박사가 사진기를 들고 다니니, 일본 경찰이 사진기만 보면 뒤로 숨었다.")),
        C("만세 운동의 힘을 모아 임시 정부를 세운다", () => { S.flags.govt = true; const was = has("jgov"); if (!was) S.done.push({ id: "jgov", turn: S.turn, ok: true, by: "event" }); return SR(was ? { kp: 6, har: 6 } : { kp: 9, har: 5, gold: -5 }, was ? "임시 정부에 힘이 모이며 독립운동의 중심이 되었어요." : "1919년 4월, 상하이에 대한민국 임시 정부가 세워졌어요. '대한민국'이라는 이름이 이때 처음 쓰였어요.", [0.3, 0, 0.3], "임시 정부 청사가 작아, 국무 회의 때 의자 대신 짐 상자에 앉았다."); }, "'임시 정부 세우기' 정책을 한 것과 같아요."),
        GB("만세 소리를 모아 일제히 무장 봉기를 한다", 0.25, () => SR({ def: 12, ppl: 6 }, "전국의 의병과 독립군이 한꺼번에 일어나 일본군을 크게 흔들었어요!", [0.4, 0.9, 0.3], "독립군이 한꺼번에 일어나니, 일본군 사령관이 지도를 거꾸로 펼쳤다."), () => SR({ def: -10, ppl: -6, har: -2 }, "총칼 앞에 많은 사람이 다치고 붙잡혔어요(제암리 사건처럼).", [0.4, 0.9, 0.3], "봉기가 꺾이니, 붙잡힌 사람들이 감옥에서도 만세를 불렀다.", FAILX), "실패하면 독립군과 독립 의지가 크게 줄어요."),
      ] },
    j8: { h: "軍", title: "만주 벌판의 독립군", text: () => `만주의 독립군이 일본군을 크게 무찔렀어요(1920년 봉오동·청산리 전투). 일본군은 복수하겠다며 한국인 마을을 공격하고 있어요(간도 참변). 우리 독립군의 힘은 약 ${S.st.def + (has("jbase") ? 10 : 0) + (S.flags.govt ? 4 : 0)}, 일본군은 약 60이에요.`,
