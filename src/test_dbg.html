    "백제 금동대향로": { g: "위대한 유물", w: "백제 · 6세기 후반(사비 시대)", m: "금동 · 높이 61.8cm · 국립부여박물관 · 국보", t: "1993년 부여 능산리 절터의 진흙 구덩이에서 1,400년 만에 거의 완벽한 모습으로 나왔어요. 받침은 하늘로 솟구치는 용이에요. 뚜껑에는 겹겹이 솟은 산봉우리 사이로 사람, 동물, 다섯 악사가 숨어 있고, 맨 꼭대기에는 봉황이 앉아 있어요. 향을 피우면 산 사이 구멍으로 연기가 피어올라 신선 세계가 살아 움직였을 거예요." },
    "서산 마애여래삼존상": { g: "위대한 유물", w: "백제 · 6세기 말~7세기 초", m: "바위에 새긴 불상 · 본존 높이 약 2.8m · 충청남도 서산 · 국보", t: "가야산 골짜기의 큰 바위에 부처 셋을 새겼어요. 해가 움직이면 빛이 비치는 방향이 바뀌고, 그에 따라 부처의 웃음이 달라져 보여요. 아침에는 밝게, 저녁에는 은은하게 웃어요. 그래서 '백제의 미소'라는 별명을 얻었어요. 바닷길로 중국을 오가던 길목에 있어, 먼 길을 떠나는 사람들의 안전을 빌었을 거예요." },
    "칠지도": { g: "위대한 유물", w: "백제 · 4세기 후반(369년 설)", m: "쇠칼에 금 글씨 · 길이 74.9cm · 일본 나라현 이소노카미 신궁", t: "칼날 양쪽으로 가지가 셋씩, 모두 일곱 갈래로 뻗은 신기한 칼이에요. 칼몸에 금실을 박아 넣은 글자 60여 자가 있어요. 백제 왕세자가 왜왕에게 만들어 보냈다는 내용이에요. 칼은 지금 일본 신사에 보관되어 있어요. 백제가 앞선 쇠 다루는 기술로 바다 건너 왜와 활발히 교류했음을 보여 주는 증거예요." },
    "무령왕릉 금제 관장식": { g: "위대한 유물", w: "백제 · 6세기 전반", m: "금판 · 왕 것 높이 약 30cm · 국립공주박물관 · 국보", t: "1971년 공주 송산리에서 도굴되지 않은 왕릉이 발견되었어요. 무덤 안 돌판(지석)에 '영동대장군 백제 사마왕'이라고 적혀 있었어요. 그래서 주인이 무령왕으로 확실히 밝혀졌어요. 이 관장식은 왕의 관모에 꽂던 금 장식이에요. 불꽃처럼 타오르는 덩굴무늬에 작은 금 달개를 달아, 움직일 때마다 반짝였어요." },
    "정림사지 오층 석탑": { g: "건축 걸작", w: "백제 · 7세기 무렵(사비 시대)", m: "화강암 · 높이 8.33m · 충청남도 부여 · 국보", t: "나무로 짓던 탑의 모양을 돌로 옮겨 만든, 늘씬하고 단정한 탑이에요. 지붕돌 끝이 살짝 들려 있어 가볍고 우아한 느낌을 줘요. 백제가 무너진 660년, 당나라 장수 소정방이 이 탑 1층에 '백제를 평정했다'는 글을 새겼어요. 아름다움과 나라를 잃은 아픔이 함께 새겨진 탑이에요." },
    "미륵사지 석탑": { g: "건축 걸작", w: "백제 · 639년 · 무왕 때", m: "화강암 · 현재 높이 약 14.5m · 전라북도 익산 · 국보", t: "우리나라에 남은 석탑 가운데 가장 오래되고 가장 커요. 2009년 해체 수리 때 탑 안에서 사리를 모신 기록판(사리봉영기)이 나왔어요. 거기에는 639년 백제 왕후가 탑을 세웠다는 글이 적혀 있었어요. 20년 가까운 보수 끝에 2019년 다시 모습을 드러냈어요. 원래 9층이었을 것으로 보여요." },
    "『서기』": { g: "위대한 저술", w: "백제 · 4세기 후반 · 근초고왕 때 박사 고흥", m: "책 · 오늘날 전하지 않음", t: "『삼국사기』에 '백제는 나라를 연 뒤로 글로 일을 적은 적이 없었는데, 고흥을 얻어 비로소 『서기』를 갖게 되었다'고 전해요. 근초고왕이 나라를 크게 넓히던 때, 왕의 힘과 나라의 역사를 글로 남기려 했던 거예요. 책은 사라졌지만 이름만으로도 백제 전성기의 자신감을 보여 줘요.", ph: "그림은 책 모습을 상상해 그린 것" },
    // ---------- 신라 ----------
    "첨성대": { g: "과학 걸작", w: "신라 · 7세기 중엽 · 선덕 여왕 때", m: "화강암 · 높이 약 9.17m · 경상북도 경주 · 국보", t: "동아시아에 남아 있는 가장 오래된 천문대 가운데 하나예요. 둥근 몸통은 돌을 27단으로 쌓아 만들었어요. 쓰인 돌이 362개쯤이라 1년의 날 수와 비슷하다는 이야기도 전해요. 가운데 창으로 사다리를 놓고 올라가 하늘을 살폈다고 해요. 농사 날짜를 정하고 하늘의 뜻을 읽는 일은 왕의 중요한 일이었어요." },
    "황룡사 9층 목탑": { g: "건축 걸작", w: "신라 · 645년 · 선덕 여왕 때", m: "나무 · 높이 약 80m(225자) · 1238년 불탐", t: "스님 자장의 건의로, 백제 장인 아비지를 불러 지은 거대한 나무 탑이에요. 아홉 층은 신라를 괴롭히는 이웃 아홉 나라를 물리치겠다는 바람을 담았다고 전해요. 지금의 아파트 30층쯤 되는 높이였어요. 1238년 몽골군이 쳐들어왔을 때 불타 버려 지금은 주춧돌만 남았어요.", ph: "사진은 오늘날 만든 복원 모형" },
    "천마총 금관": { g: "위대한 유물", w: "신라 · 5~6세기", m: "금 · 높이 32.5cm · 국립경주박물관 · 국보", t: "1973년 경주 천마총에서 나온, 지금까지 발견된 신라 금관 가운데 가장 크고 화려한 금관이에요. 나뭇가지 모양(出자 모양) 장식 셋과 사슴뿔 모양 장식 둘을 세웠어요. 곳곳에 곱은옥과 수백 개의 금 달개를 달았어요. 하늘과 땅을 잇는 나무와 사슴을 섬기던 옛 믿음이 담겨 있어요." },
    "천마도": { g: "위대한 미술품", w: "신라 · 5~6세기", m: "자작나무 껍질에 그림 · 가로 약 75cm · 국립경주박물관 · 국보", t: "말 탄 사람의 다리에 흙이 튀지 않게 말 옆구리에 늘어뜨리는 '말다래'에 그린 그림이에요. 하얀 말이 꼬리를 세우고 구름 위를 힘차게 달려요. 무덤 이름 '천마총'도 이 그림에서 나왔어요. 신라 무덤에서 나온 거의 하나뿐인 그림이라 아주 귀해요." },
    "성덕대왕 신종": { g: "위대한 유물", w: "통일 신라 · 771년 · 혜공왕 때 완성", m: "청동 · 높이 3.66m · 무게 약 18.9톤 · 국립경주박물관 · 국보", t: "경덕왕이 아버지 성덕왕을 기리려고 만들기 시작했고, 아들 혜공왕 때 완성했어요. 소리가 커졌다 작아졌다 물결치듯 길게 이어지는 '맥놀이'가 특징이에요. 아이를 넣어 만들었다는 '에밀레' 이야기는 전설일 뿐이에요. 과학 조사에서도 그런 흔적은 나오지 않았어요.", q: "큰 소리는 하늘과 땅 사이에 울려 퍼지지만, 들어도 그 울림의 근원을 들을 수 없다.", qs: "성덕대왕 신종에 새긴 글" },
    "석굴암 본존불": { g: "위대한 유물", w: "통일 신라 · 751년 짓기 시작 · 김대성", m: "화강암 · 높이 약 3.4m · 경상북도 경주 · 국보 · 유네스코 세계유산(1995)", t: "단단한 화강암을 쌓아 인공 동굴을 만들고, 그 안에 모신 부처예요. 둥근 천장, 좌우가 맞는 비례, 은은한 미소가 하나로 어우러져요. 그래서 동아시아 불교 조각의 최고 걸작으로 꼽혀요. 동해를 바라보도록 앉혀서, 바다에서 떠오르는 해를 맞이해요." },
    "불국사 다보탑": { g: "건축 걸작", w: "통일 신라 · 8세기 중엽", m: "화강암 · 높이 약 10.3m · 경상북도 경주 · 국보", t: "보통 탑과 달리 계단, 난간, 연꽃잎을 나무 다루듯 깎아 만든 매우 화려한 돌탑이에요. 맞은편의 단정한 석가탑과 짝을 이뤄요. 계단 위에는 돌사자 네 마리가 있었어요. 일제 강점기에 세 마리가 사라져 지금은 한 마리만 남았어요. 10원짜리 동전에 그려진 탑이에요." },
    "『국사』": { g: "위대한 저술", w: "신라 · 545년 · 진흥왕 때 거칠부", m: "책 · 오늘날 전하지 않음", t: "이사부가 '나라의 역사는 임금과 신하의 잘잘못을 적어 후대에 보이는 것'이라며 역사책을 만들자고 했어요. 진흥왕이 이를 받아들여 거칠부에게 『국사』를 짓게 했어요. 한강 유역을 차지하며 나라를 크게 넓히던 바로 그때였어요. 책은 사라졌지만, 신라가 큰 나라로서 스스로를 기록하기 시작한 순간이에요.", ph: "그림은 책 모습을 상상해 그린 것" },
    // ---------- 고려 ----------
    "상감 청자": { g: "위대한 유물", w: "고려 · 12세기 중엽~13세기", m: "도자기 · 사진은 청자 상감 운학문 매병(간송미술관, 국보)", t: "그릇 겉면을 파내고 그 자리에 흰 흙과 붉은 흙을 메운 뒤 유약을 발라 구워요. 그러면 흰색과 검은색 무늬가 비췻빛 속에 떠올라요. 이것이 고려가 처음 만들어 낸 '상감' 기법이에요. 사진 속 매병에는 구름 사이를 나는 학이 수십 마리 새겨져 있어요. 중국 송나라 사람들도 고려 청자의 빛깔을 최고로 쳤어요.", q: "고려의 비색은 천하제일이다.", qs: "송나라 태평노인, 『수중금』" },
    "팔만대장경": { g: "위대한 저술", w: "고려 · 1236~1251년", m: "목판 81,258장 · 경상남도 합천 해인사 · 국보 · 세계기록유산(2007)", t: "몽골군이 쳐들어오자 고려는 강화도로 도읍을 옮겼어요. 그리고 부처의 힘으로 나라를 지키겠다며 16년에 걸쳐 불경을 나무판에 새겼어요. 글자가 5,000만 자가 넘는데 틀린 글자가 거의 없어요. 바람이 잘 통하게 지은 장경판전 덕분에 750년이 넘도록 썩지 않고 남아 있어요." },
    "『직지심체요절』": { g: "위대한 저술", w: "고려 · 1377년 · 청주 흥덕사", m: "금속 활자본 · 하권 1책 · 프랑스 국립도서관 · 세계기록유산(2001)", t: "백운 스님이 부처와 고승의 가르침을 모은 책이에요. 쇠로 만든 활자로 찍었어요. 지금 남아 있는 금속 활자 책 가운데 세계에서 가장 오래되었어요. 독일 구텐베르크보다 78년이나 앞서요. 구한말 프랑스로 건너가 지금은 파리에 있어요. 박병선 박사가 도서관에서 이 책을 찾아내 세상에 알렸어요." },
    "『삼국사기』": { g: "위대한 저술", w: "고려 · 1145년 · 김부식", m: "역사서 50권 · 국보", t: "인종의 명을 받아 김부식과 학자들이 고구려·백제·신라의 역사를 정리한 책이에요. 지금 남아 있는 우리 역사책 가운데 가장 오래되었어요. 왕의 이야기(본기), 제도(지), 인물 이야기(열전)로 나누어 썼어요. 을지문덕, 김유신, 온달 이야기도 여기에 실려 있어요." },
    "부석사 무량수전": { g: "건축 걸작", w: "고려 · 1376년 다시 지음", m: "나무 건축 · 경상북도 영주 · 국보", t: "우리나라에 남은 가장 오래된 나무 건물 가운데 하나예요. 기둥 가운데가 살짝 불룩한 '배흘림기둥'이 지붕 무게를 받쳐 줘요. 멀리서 보면 기둥이 똑바르고 든든해 보이게 하는 눈속임 기술이에요. 처마 끝이 하늘로 살짝 들려 있어서 무거운 지붕이 오히려 가볍게 날아갈 듯 보여요." },
    "나전칠기 경함": { g: "위대한 유물", w: "고려 · 12~13세기", m: "나무에 옻칠·자개·금속선 · 전 세계에 몇 점만 남음", t: "불경을 담아 두던 상자예요. 얇게 간 전복·조개껍데기(자개)를 수천 조각으로 잘라 국화와 덩굴무늬를 붙였어요. 구리선으로 줄기를 그리고 옻칠로 마무리했어요. 송나라 사신 서긍도 고려의 나전 솜씨를 '세밀하여 귀하다'고 칭찬했어요. 남은 것이 아주 적어 대부분 해외 박물관에 있어요." },
    "수월관음도": { g: "위대한 미술품", w: "고려 · 14세기", m: "비단에 채색 · 고려 불화는 세계에 약 160점, 대부분 일본에 있음", t: "물가 바위에 앉은 관음보살을 그린 불화예요. 아래에서 선재동자가 가르침을 구해요. 몸을 덮은 얇은 베일 너머로 옷의 무늬가 비쳐 보여요. 붓끝으로 비단 위에 투명함을 그려 낸 놀라운 솜씨예요. 금가루와 귀한 광물 물감을 써서 700년이 지나도 빛이 바래지 않았어요." },
    // ---------- 조선 전기 ----------
    "『훈민정음 해례본』": { g: "위대한 저술", w: "조선 · 1446년 · 세종과 집현전 학자들", m: "목판본 1책 · 간송미술관 · 국보 · 세계기록유산(1997)", t: "새 글자 훈민정음을 만든 까닭과 글자의 원리를 풀어 쓴 책이에요. 닿소리는 소리 낼 때의 입과 혀 모양을 본떴어요. 홀소리는 하늘(·), 땅(ㅡ), 사람(ㅣ)을 본떴어요. 글자를 만든 사람과 원리가 기록으로 남은 문자는 세계에서 아주 드물어요. 1940년 간송 전형필이 큰돈을 들여 지켜 냈어요.", q: "나라의 말이 중국과 달라 문자와 서로 통하지 아니하므로, 어리석은 백성이 말하고자 하는 바가 있어도 마침내 제 뜻을 펴지 못하는 사람이 많다.", qs: "훈민정음 서문" },
    "『조선왕조실록』": { g: "위대한 저술", w: "조선 · 태조~철종 472년(1392~1863)", m: "1,893권 888책 · 국보 · 세계기록유산(1997)", t: "왕이 세상을 떠나면 사관이 날마다 적어 둔 기록(사초)을 모아 실록을 만들었어요. 왕도 실록을 볼 수 없었어요. 그래서 사관은 왕의 잘못까지 그대로 적을 수 있었어요. 전쟁과 화재를 대비해 산속 여러 곳의 사고(史庫)에 나누어 보관했어요. 덕분에 임진왜란 때도 살아남았어요." },
    "자격루": { g: "과학 걸작", w: "조선 · 1434년 · 장영실", m: "물시계 · 지금 남은 것은 1536년에 다시 만든 것의 일부(국보)", t: "물이 일정하게 흘러 통에 차면 잣대가 떠올라요. 잣대가 쇠구슬을 건드리면 구슬이 굴러가며 장치를 움직여요. 그러면 인형이 종·북·징을 쳐서 시각을 알려요. 사람이 밤새 지켜보지 않아도 '스스로(自) 치는(擊) 시계(漏)'였어요. 나라의 표준 시계로 쓰였어요." },
    "앙부일구": { g: "과학 걸작", w: "조선 · 1434년 · 세종 때", m: "청동 해시계 · 솥 모양", t: "하늘을 우러르는 솥(앙부) 모양의 해시계예요. 바늘(영침)의 그림자가 오목한 면에 그어진 줄을 따라 움직여요. 그래서 시각과 절기를 함께 알려 줘요. 세종은 이 시계를 길가에 두었어요. 글을 모르는 백성도 볼 수 있도록 시각마다 동물(십이지) 그림을 그려 넣었어요." },
    "혼천의": { g: "과학 걸작", w: "조선 · 1433년 · 이천·장영실 등", m: "청동·나무 고리로 만든 천문 기구", t: "여러 겹의 고리를 돌려 해·달·별의 위치와 움직임을 재는 기구예요. 세종은 경복궁에 천문 관측대(간의대)를 짓고 이런 기구들을 두었어요. 그리고 우리 하늘에 맞는 달력 『칠정산』을 만들게 했어요. 남의 나라 달력을 빌려 쓰지 않으려는 노력이었어요." },
    "측우기": { g: "과학 걸작", w: "조선 · 1441년 만들고 1442년 전국에 둠", m: "쇠 원통 · 지금 남은 것은 1837년 금영 측우기(국보)", t: "비가 온 양을 정확히 재는 기구예요. 세자였던 문종이 비 오는 날 땅에 스며든 깊이를 재 보다가 생각해 냈다고 전해요. 서울과 각 고을에 같은 크기의 측우기를 두고 비의 양을 보고하게 했어요. 서양보다 약 200년 앞선, 나라 전체의 강우량 관측이었어요." },
    "『농사직설』": { g: "위대한 저술", w: "조선 · 1429년 · 세종의 명, 정초·변효문", m: "농서 1권", t: "그때까지는 중국 농사책을 보고 농사를 지었어요. 그런데 땅과 기후가 달라 잘 맞지 않았어요. 세종은 각 도의 경험 많은 농부에게 직접 물어 우리 땅에 맞는 농사법을 모으게 했어요. 씨앗 고르기, 논밭 갈기, 거름 주기를 곡식마다 쉽게 정리한 우리나라 최초의 농사책이에요." },
    "종묘 제례악": { g: "위대한 음악", w: "조선 · 세종이 짓고 세조 때 제례에 씀", m: "음악·노래·춤 · 국가무형유산 · 유네스코 인류무형유산(2001)", t: "종묘에서 왕실 조상께 제사를 올릴 때 연주하는 음악이에요. 악기 연주, 노래, 춤(일무)이 함께 어우러져요. 조상의 문덕을 기리는 '보태평'과 무공을 기리는 '정대업'으로 이루어져 있어요. 600년 가까이 이어져 지금도 해마다 5월에 직접 들을 수 있어요." },
    // ---------- 조선 후기 ----------
    "『동의보감』": { g: "위대한 저술", w: "조선 · 1610년 완성 · 허준", m: "의학서 25권 · 국보 · 세계기록유산(2009)", t: "선조의 명을 받아 임진왜란의 어려움 속에서 14년 동안 쓴 의학 백과사전이에요. 병의 원인과 치료법을 몸의 안과 밖으로 나누어 정리했어요. 약재 이름 옆에 한글 이름을 적었어요. 우리 땅에서 나는 약재를 쓰게 해서, 가난한 백성도 스스로 치료할 수 있도록 했어요. 중국과 일본에서도 여러 번 다시 찍었어요." },
    "백자 달항아리": { g: "위대한 유물", w: "조선 · 17세기 후반~18세기 전반", m: "백자 · 높이 40cm 남짓", t: "너무 커서 한 번에 빚을 수 없었어요. 그래서 위아래 반쪽을 따로 만들어 이어 붙였어요. 그래서 완벽한 원이 아니라 살짝 일그러진 둥근 모양이 되었어요. 꾸밈없는 흰빛과 넉넉한 모양이 보름달을 닮아 '달항아리'라 불려요. 꾸미지 않은 아름다움을 아꼈던 조선 사람들의 마음이 담겼어요." },
    "정선의 「인왕제색도」": { g: "위대한 미술품", w: "조선 · 1751년 · 겸재 정선(76세)", m: "종이에 먹 · 79.2×138.2cm · 국립중앙박물관 · 국보", t: "장맛비가 그친 뒤 안개가 피어오르는 인왕산을 그렸어요. 비에 젖은 큰 바위는 먹을 여러 번 덧칠해 묵직하고 검게 표현했어요. 중국 그림을 흉내 내지 않고, 우리 산을 직접 보고 그린 '진경산수화'의 대표 작품이에요. 일흔여섯 나이에 그린 마지막 걸작이에요." },
    "『징비록』": { g: "위대한 저술", w: "조선 · 1600년 무렵 · 서애 류성룡", m: "기록문 · 국보", t: "임진왜란 때 영의정으로 전쟁을 이끈 류성룡이 벼슬에서 물러나 쓴 기록이에요. 전쟁 전의 방심, 이순신을 천거한 일, 조정의 실수까지 숨기지 않고 적었어요. 다시는 이런 일을 당하지 않도록 뒷사람에게 교훈을 남기려 한 반성의 책이에요.", q: "予其懲而毖後患 — 내가 지난 일을 징계하여 뒷근심이 없도록 삼가노라.", qs: "『시경』, 책 이름의 출처" },
    "『반계수록』": { g: "위대한 저술", w: "조선 · 1670년 완성 · 반계 유형원", m: "26권 · 1770년 영조 때 펴냄", t: "유형원이 전라도 부안 우반동에 내려가 20년 동안 쓴 개혁안이에요. 땅을 농민에게 고루 나누어 주는 제도를 비롯해 세금, 군대, 교육, 관리 뽑기까지 나라를 어떻게 고칠지 적었어요. 생전에는 빛을 보지 못했어요. 하지만 이익·정약용 같은 실학자들에게 큰 영향을 주었어요." },
    "『속대전』": { g: "위대한 저술", w: "조선 · 1746년 · 영조 때", m: "법전 6권", t: "조선의 기본 법전 『경국대전』이 만들어진 뒤 300년 가까이 새 법과 규칙이 계속 쌓였어요. 영조는 그 가운데 지금 쓸 법만 골라 새로 정리하게 했어요. 법이 뒤죽박죽이면 관리가 마음대로 판결하기 쉬워요. 그래서 법을 분명히 하는 것도 백성을 지키는 일이었어요." },
    "판소리 춘향가": { g: "위대한 음악", w: "조선 후기 · 소리꾼들이 다듬어 전함", m: "판소리 · 유네스코 인류무형유산(2003)", t: "소리꾼 한 사람이 고수의 북장단에 맞춰 노래(소리), 말(아니리), 몸짓(발림)으로 긴 이야기를 들려줘요. 남원 광한루에서 만난 춘향과 몽룡의 이야기예요. 신분을 넘어선 사랑과 탐관오리를 벌하는 통쾌함으로 백성들에게 가장 사랑받았어요. '일 고수 이 명창'이라 할 만큼 북 치는 고수도 중요해요." },
    "대동여지도의 밑그림": { g: "위대한 저술", w: "조선 · 1861년 · 고산자 김정호", m: "목판 지도 22첩 · 모두 펼치면 세로 약 6.7m · 보물", t: "온 나라를 22권의 책처럼 접어 들고 다닐 수 있게 만든 지도예요. 산줄기와 물줄기를 실핏줄처럼 그렸어요. 길 위에는 10리마다 점을 찍어 거리를 알 수 있게 했어요. 김정호가 온 나라를 걸어 다니며 백두산을 여러 번 올랐다는 이야기는 확인되지 않은 이야기예요. 앞선 여러 지도를 모으고 고쳐 가장 정확한 지도로 완성한 거예요. 나무판에 새겨 여러 장 찍을 수 있게 했어요." },
    // ---------- 대한 제국 ----------
    "독립문": { g: "건축 걸작", w: "대한 제국 · 1897년 완공 · 독립협회", m: "화강암 · 높이 약 14.3m · 서울 서대문 · 사적", t: "중국 사신을 맞던 영은문을 헐었어요. 그 자리 곁에 독립협회가 백성들의 성금을 모아 세운 문이에요. 프랑스 개선문을 본떴어요. 앞뒤에 '독립문'이 한글과 한자로 새겨져 있어요. 청나라에서 벗어나 자주 독립국이 되겠다는 다짐을 돌에 새긴 것이에요." },
    "『독립신문』": { g: "위대한 저술", w: "1896년 4월 7일 창간 · 서재필", m: "신문 · 한글판과 영문판", t: "우리나라 최초의 민간 신문이에요. 한문 대신 순 한글로 쓰고 띄어쓰기를 했어요. 그래서 누구나 읽을 수 있었어요. 영문판도 함께 내서 우리 사정을 외국에 알렸어요. 창간일인 4월 7일은 지금 '신문의 날'이에요.", q: "우리 신문이 한문은 아니 쓰고 다만 국문으로만 쓰는 것은 상하귀천이 다 보게 함이라.", qs: "『독립신문』 창간 논설(오늘날 말로 고침)" },
    "덕수궁 석조전": { g: "건축 걸작", w: "대한 제국 · 1900년 짓기 시작해 1910년 완공", m: "돌로 지은 서양식 궁궐 · 서울 덕수궁", t: "고종 황제가 근대 국가를 꿈꾸며 지은 서양식 궁궐이에요. 영국인이 설계했고, 그리스 신전 같은 돌기둥이 늘어서 있어요. 황제가 외국 사신을 맞고 머무는 곳이었어요. 완공된 1910년에 나라를 빼앗기는 슬픔을 겪었어요. 지금은 '대한제국역사관'이에요." },
    "환구단": { g: "건축 걸작", w: "대한 제국 · 1897년", m: "제단 · 지금은 황궁우만 남음 · 서울 소공동 · 사적", t: "1897년 10월 고종이 이곳에서 하늘에 제사를 올리고 황제 자리에 올랐어요. 그리고 나라 이름을 '대한 제국'이라 선포했어요. 하늘에 제사 지내는 것은 황제만 할 수 있는 일이었어요. 그래서 다른 나라와 대등하다는 뜻이었어요. 1913년 일제가 제단을 헐고 호텔을 지어, 지금은 신위를 모시던 팔각 건물 황궁우만 남았어요.", ph: "사진은 남아 있는 황궁우" },
    "대한 제국 애국가": { g: "위대한 음악", w: "대한 제국 · 1902년 · 에케르트 작곡", m: "악보집 · 독일어 해설 함께 실림", t: "황제의 나라에 걸맞은 국가가 필요해서 만든, 우리나라 최초의 공식 국가예요. 독일인 음악가 에케르트가 우리 가락을 살려 곡을 붙였어요. 그리고 군악대가 연주했어요. 외국에 보내는 악보에는 독일어 설명을 함께 실어 대한 제국을 알렸어요.", q: "상제는 우리 황제를 도우소서.", qs: "대한 제국 애국가 첫 구절" },
    "『조선말 큰사전』 원고": { g: "위대한 저술", w: "1929년 시작 · 조선어 학회", m: "원고 · 1947~1957년 6권으로 펴냄 · 보물", t: "일제가 우리말을 쓰지 못하게 하던 때, 조선어 학회가 전국에서 낱말을 모아 사전을 만들었어요. 1942년 일제가 학자들을 잡아가고 원고를 빼앗았어요(조선어 학회 사건). 광복 직후인 1945년 9월, 서울역 창고에서 기적처럼 원고가 다시 발견되었어요. 우리말을 끝까지 지켜 낸 사람들의 땀이 배어 있어요." },
    // ---------- 몽골 ----------
    "『몽골비사』": { g: "위대한 저술", w: "몽골 제국 · 13세기", m: "역사서 · 몽골말을 한자 소리로 적어 전함", ph: "그림은 책 모습을 상상해 그린 것", t: "칭기즈 칸의 조상 이야기부터 테무친이 온갖 고난을 이기고 초원을 하나로 묶기까지의 이야기를 담았어요. 몽골 사람들이 직접 쓴 가장 오래된 역사 이야기예요. 원래 글은 사라졌어요. 하지만 중국 명나라가 몽골말 소리를 한자로 받아 적어 둔 덕분에 지금까지 전해요.", q: "칭기즈 칸의 근원은, 하늘의 명을 받고 태어난 푸른 늑대였다.", qs: "『몽골비사』 첫머리" },
    "파이자(통행증)": { g: "위대한 유물", w: "몽골 제국 · 13~14세기", m: "금·은·쇠로 만든 패", t: "칸의 명령을 받은 사람이 목에 걸거나 허리에 차던 통행증이에요. 이것만 보여 주면 제국 어디서든 역참에서 말과 음식, 잠자리를 얻을 수 있었어요. 금, 은, 쇠 가운데 무엇으로 만들었는지가 지위를 나타냈어요. 마르코 폴로도 이 패를 받아 여행했다고 적었어요.", q: "영원한 하늘의 힘으로, 칸의 이름이 거룩하리라. 따르지 않는 자는 죽으리라.", qs: "파이자에 새긴 글" },
    "카라코룸 은나무 분수": { g: "위대한 유물", w: "몽골 제국 · 13세기 중엽 · 금세공인 기욤 부셰", m: "은 · 오늘날 사라짐", t: "몽골의 수도 카라코룸 궁전 앞에 있던 은으로 만든 나무예요. 네 개의 관에서 포도주, 마유주, 꿀술, 쌀술이 흘러나왔어요. 꼭대기의 천사가 나팔을 불면 술이 쏟아졌다고 해요. 전쟁에서 데려온 파리 출신 장인이 만들었어요. 1254년 이곳을 찾은 수도사 루브룩이 기록으로 남겼어요.", ph: "사진은 오늘날 다시 만든 모형" },
    "역참 지도": { g: "위대한 저술", w: "몽골 제국 · 13세기", m: "제도(잠) · 사진은 오늘날 그린 제국 지도", t: "몽골은 넓은 제국 곳곳에 일정한 거리마다 역참(잠)을 두었어요. 그리고 말과 사람을 준비해 두었어요. 전령은 역참마다 지친 말을 새 말로 갈아타며 하루에 수백 km를 달렸어요. 덕분에 동쪽 끝의 소식이 서쪽 끝까지 빠르게 전해졌어요. 상인과 여행자도 비교적 안전하게 오갈 수 있었어요.", ph: "사진은 오늘날 그린 지도" },
    // ---------- 프랑스 혁명 ----------
    "『인권 선언』": { g: "위대한 저술", w: "프랑스 · 1789년 8월 26일 · 국민 의회", m: "선언문 17개 조", t: "바스티유 감옥을 무너뜨린 지 한 달 남짓 지나 발표한 선언이에요. 사람은 누구나 자유롭고 평등하며, 나라의 주인은 국민이라고 밝혔어요. 왕의 명령보다 모두가 함께 정한 법이 위에 있다는 생각을 세상에 퍼뜨렸어요. 오늘날 여러 나라 헌법과 세계 인권 선언의 바탕이 되었어요.", q: "사람은 자유롭고 권리에 있어 평등하게 태어나 살아간다.", qs: "『인간과 시민의 권리 선언』 제1조" },
    "『백과전서』": { g: "위대한 저술", w: "프랑스 · 1751~1772년 · 디드로·달랑베르", m: "본문 17권·그림 11권 · 7만여 항목", t: "세상의 모든 지식을 한데 모으겠다는 꿈으로 만든 큰 사전이에요. 철학과 과학뿐 아니라 대장장이, 유리 만드는 사람 같은 장인의 기술까지 그림으로 자세히 실었어요. 사람의 이성으로 세상을 이해할 수 있다는 계몽사상을 퍼뜨렸어요. 그래서 왕과 교회가 여러 번 출판을 막았어요." },
    "『나폴레옹 법전』": { g: "위대한 저술", w: "프랑스 · 1804년 · 나폴레옹", m: "민법전 2,281개 조", t: "혁명 뒤 지방마다 제각각이던 법을 하나로 묶은 프랑스 민법이에요. 귀족의 특권을 없애고 법 앞의 평등, 재산권, 종교의 자유를 정했어요. 나폴레옹이 정복한 나라에도 퍼졌어요. 그래서 오늘날 세계 여러 나라 민법의 뿌리가 되었어요.", q: "나의 진정한 영광은 마흔 번의 전투 승리가 아니라, 영원히 남을 나의 민법전이다.", qs: "나폴레옹이 남겼다고 전하는 말" },
    "루브르 박물관": { g: "건축 걸작", w: "프랑스 · 1793년 박물관으로 문 엶", m: "옛 왕궁 · 파리", t: "왕들이 살던 궁전이자 왕실의 보물 창고였어요. 혁명 정부는 이곳을 모든 시민에게 열었어요. 왕만 보던 미술품을 누구나 볼 수 있게 된 거예요. 그래서 '박물관은 모두의 것'이라는 생각이 시작된 곳으로 꼽혀요. 지금은 세계에서 가장 많은 사람이 찾는 박물관이에요.", ph: "사진 속 유리 피라미드는 1989년에 세운 것" },
    // ---------- 아메리카 원주민 ----------
    "체로키 문자 신문": { g: "위대한 저술", w: "체로키족 · 1828년 창간 · 『체로키 피닉스』", m: "신문 · 체로키 문자와 영어", t: "글을 몰랐던 세쿼이아가 12년 동안 연구해 체로키 말의 소리마다 글자를 붙인 음절 문자 86자를 만들었어요. 배우기 쉬워서 몇 년 만에 많은 체로키 사람이 글을 읽고 썼어요. 그리고 자기 글자로 신문까지 펴냈어요. 우리 훈민정음처럼, 한 사람이 만든 문자가 한 민족의 기록을 바꾼 이야기예요." },
    "윈터 카운트": { g: "위대한 미술품", w: "라코타 등 평원 부족 · 18~19세기", m: "버펄로 가죽이나 천에 그림", t: "해마다 겨울이 오면 그해에 일어난 가장 큰 일 하나를 그림 하나로 그렸어요. 별똥별이 쏟아진 해, 큰 병이 돈 해 같은 것들이에요. 그림이 소용돌이처럼 이어지며 수십 년의 역사가 쌓였어요. 그림을 맡아 보관하는 사람이 그림을 짚으며 마을 사람들에게 역사를 들려주었어요. 그림으로 쓴 달력이자 역사책이에요." },
    "토템 폴": { g: "위대한 미술품", w: "북서 해안 부족(하이다·틀링깃 등)", m: "붉은 삼나무 기둥", t: "커다란 삼나무에 까마귀, 독수리, 곰, 고래 같은 동물과 조상을 층층이 새긴 기둥이에요. 집안의 내력, 중요한 사건, 고마운 사람을 기리는 이야기가 담겨 있어요. 글 대신 조각으로 쓴 집안의 족보이자 기념비예요. 잔치(포틀래치)를 열어 세웠어요." },
    "깃털 머리 장식": { g: "위대한 유물", w: "평원 부족(라코타 등)", m: "독수리 깃털·가죽", ph: "그림은 일러스트", t: "깃털 하나하나는 용감한 일이나 공동체를 위한 일을 해냈을 때 받은 거예요. 그래서 깃털이 많을수록 존경받는 사람이라는 뜻이었어요. 아무나 쓸 수 없는 명예의 상징이에요. 그래서 오늘날 이것을 재미로 흉내 내어 쓰는 것은 원주민에게 무례한 일이 될 수 있어요." },
    // ---------- 잉글랜드 ----------
    "『캔터베리 이야기』": { g: "위대한 저술", w: "잉글랜드 · 1387~1400년 무렵 · 제프리 초서", m: "이야기 시 모음", t: "기사, 방앗간 주인, 수녀원장, 요리사 등 온갖 사람들이 캔터베리 대성당으로 순례를 떠나요. 가는 길에 돌아가며 이야기를 들려주고 누가 더 재미있게 하나 겨뤄요. 귀족들이 프랑스어와 라틴어를 쓰던 때, 백성의 말인 영어로 쓴 걸작이에요. 그래서 '영문학의 아버지'라는 이름을 얻었어요.", q: "Whan that Aprill with his shoures soote… — 4월의 단비가 3월의 가뭄을 뿌리까지 적시면…", qs: "『캔터베리 이야기』 첫 구절", ph: "사진은 1400년 무렵의 엘즈미어 필사본 — 말 탄 사람이 초서" },
    "고딕 대성당": { g: "건축 걸작", w: "유럽 · 12~16세기", m: "돌 건축", t: "끝이 뾰족한 아치와 건물 밖에서 벽을 받치는 버팀벽 덕분에 벽을 얇게 할 수 있었어요. 그래서 높이 쌓으면서도 커다란 창을 낼 수 있었어요. 그 창을 채운 스테인드글라스로 빛이 쏟아져 들어와요. 글을 모르는 사람도 창의 그림으로 성경 이야기를 읽었어요. 짓는 데 100년이 넘게 걸린 성당도 많아요." },
    "채색 필사본": { g: "위대한 미술품", w: "잉글랜드 · 8~15세기", m: "양피지에 금박과 물감", ph: "사진은 1400년 무렵의 엘즈미어 필사본", t: "인쇄술이 없던 때 수도사들이 양가죽 종이에 한 글자씩 손으로 베껴 쓴 책이에요. 첫 글자를 크게 장식하고 금박과 귀한 물감으로 그림을 그려 넣었어요. 그래서 책장이 빛나는 것처럼 보여요. 책 한 권을 만드는 데 몇 년씩 걸려서, 책 자체가 보물이었어요." },
    "장궁(긴 활)": { g: "위대한 유물", w: "잉글랜드 · 14~15세기", m: "주목 나무 · 길이 약 1.8m", t: "사람 키만큼 긴 나무 활이에요. 숙련된 궁수는 1분에 10발 넘게 쏠 수 있었어요. 1346년 크레시 전투에서 잉글랜드 궁수들이 훨씬 많은 프랑스 기사들을 물리쳤어요. 왕은 백성들이 일요일마다 활쏘기를 연습하도록 법으로 정할 만큼 장궁을 중요하게 여겼어요." },
    // ---------- 촉한 ----------
    "「출사표」": { g: "위대한 저술", w: "촉한 · 227년 · 제갈량", m: "상소문", t: "유비가 세상을 떠난 뒤 승상 제갈량이 위나라를 치러 떠나며 어린 황제 유선에게 올린 글이에요. 선제 유비에게 입은 은혜와 나라를 향한 충성, 황제가 지켜야 할 일을 간곡하게 적었어요. 예부터 '이 글을 읽고 울지 않는 사람은 충신이 아니다'라는 말이 전해요.", q: "신 량이 아룁니다. 선제께서 나라를 세우는 일을 절반도 이루지 못하시고 중도에 돌아가셨습니다.", qs: "「출사표」 첫머리" },
    "목우유마": { g: "과학 걸작", w: "촉한 · 231~234년 · 제갈량", m: "나무 수레 · 정확한 모습은 전하지 않음", t: "험한 산길로 북벌을 떠나면 군량을 나르는 일이 가장 큰 어려움이었어요. 제갈량은 '나무 소(목우)'와 '흐르는 말(유마)'이라는 수레를 만들어 이 문제를 풀었다고 해요. 역사책에 기록은 남았지만 정확한 구조는 전하지 않아요. 외바퀴 수레였다는 의견이 많아요.", ph: "사진은 오늘날 추정해 만든 모형" },
    "촉 비단(촉금)": { g: "위대한 유물", w: "촉 땅(지금의 쓰촨) · 한~삼국 시대", m: "여러 색 실로 무늬를 짠 비단", t: "촉의 도읍 성도는 비단을 짜는 관청이 있어 '금관성'이라 불렸어요. 촉 비단은 무늬가 화려하고 질겨서 위나라와 오나라에서도 비싸게 팔렸어요. 땅이 좁고 사람이 적은 촉한이 큰 나라들과 맞설 수 있었던 중요한 살림 밑천이었어요.", q: "지금 백성은 가난하고 나라 곳간은 비어, 적과 싸울 밑천은 오직 비단뿐이다.", qs: "제갈량이 했다고 전하는 말" },
    "무후사": { g: "건축 걸작", w: "촉한 이후 · 지금 건물은 1672년 다시 지음", m: "사당 · 중국 쓰촨성 청두", t: "유비의 무덤(혜릉) 곁에 제갈량을 기리는 사당을 함께 지은 곳이에요. '무후'는 제갈량이 받은 시호예요. 천 년이 넘도록 사람들이 찾아와 지혜와 충성의 상징인 제갈량을 기렸어요. 그래서 임금보다 신하의 사당이 더 유명한 드문 곳이 되었어요.", q: "승상의 사당을 어디서 찾을까, 금관성 밖 측백나무 우거진 곳이라네.", qs: "두보, 「촉상」" },
  };
  const TR_GLYPH = { 비석: "碑", 벽화: "畵", 그림: "畵", 불상: "佛", 역사서: "史", 책: "書", 공예: "工", 탑: "塔", 건축: "殿", 과학: "天", 종: "鐘", 음악: "樂", 지도: "圖" };
  function trInfo(n) { return TRI[n] || {}; }
  // 사진 파일: tr/<나라키>_<번호>.jpg — 없으면 갈래 글자 그림으로 대신해요
  const TR_NOIMG = new Set([]);
  function trImgId(n) { for (const k in TR) { const i = TR[k].findIndex((x) => x[0] === n); if (i >= 0) return `${k}_${i}`; } return ""; }
  function trPhoto(t, cls) {

      ${[0, 1, 2].map((r) => `<path d="M0 ${228 + r * 11} ${Array.from({ length: 19 }, (_, i) => `Q ${i * 40 + 20} ${222 + r * 11} ${i * 40 + 40} ${228 + r * 11}`).join(" ")}" fill="none" stroke="var(--wave)" stroke-width="4"/>`).join("")}

  function renderStart() {
    const sel = (i) => `<label class="gsel"><span class="no">${i + 1}</span><span class="sub">${["가장 중요하게 여길 것", "두 번째로 중요한 것", "세 번째로 중요한 것"][i]}</span>
      <select id="goal${i}" data-goal="${i}">${ST.map((x) => `<option value="${x.k}" ${S.goals[i] === x.k ? "selected" : ""}>${x.h} ${x.n} — ${esc(x.d)}</option>`).join("")}</select><b class="bonus">즉위 교서 +${GOAL_BONUS[i]}</b></label>`;
    return `<section class="hero">
      ${irworobongdo()}
      <h1>왕BTI</h1>
      <p class="lead"><b>내가 왕이라면, 나는 어떤 왕일까?</b> 왕의 의자 뒤에는 해와 달, 다섯 봉우리를 그린 병풍(일월오봉도)이 놓였어요. 오늘부터 여러분이 그 앞에 앉아 30년 동안 나라를 다스려요. 어떤 정책을 먼저 펼칠지, 무엇을 미룰지에 따라 나라의 운명이 바뀌어요. 다스림이 끝나면 역사 속 어떤 왕과 가장 닮았는지 공개돼요.</p>
    </section>
    <section class="panel"><h2>1. 왕과 나라의 이름</h2>
      <div class="row"><label class="field"><span class="sub">왕의 이름</span><input id="kingName" maxlength="10" placeholder="예: 해솔" value="${esc(S.king)}"></label>
      <label class="field"><span class="sub">나라 이름 (상상 속 나라에서만 써요)</span><input id="nationName" maxlength="10" placeholder="예: 푸른 나라" value="${esc(S.nation)}"></label></div></section>
    <section class="panel"><h2>2. 어떤 나라의 왕이 될까요?</h2>
      <p class="sub">★이 많을수록 어려워요. ★★★★ 나라는 첫 시기부터 큰 위기가 기다리고, ★★★★★ 나라는 역사 속에서 가장 혹독했던 때예요. 같은 나라도 판마다 다른 사건과 선택지가 나와요.</p>
      ${[["우리 역사 속 나라 · 지도와 함께", (v) => v.real], ["상상 속 나라 · 이름 없는 왕국", (v) => !v.world && !v.real], ["세계사 속 나라", (v) => v.world]].map(([gname, gf]) => `<h3 class="sgroup">${gname}</h3>
      <div class="scens">${Object.entries(SCEN).filter(([, v]) => gf(v)).sort((x, y) => (x[1].year || 0) - (y[1].year || 0)).map(([k, v]) => `<button type="button" class="scen ${v.war || k === "F" ? "warlike" : ""} ${v.warn ? "hellcard" : ""}" data-scen="${k}" aria-pressed="${S.scen === k}">
        <span class="sh"><b>${esc(v.name)}</b>${stars(v.star)}</span>
        <span class="tags">${v.strong ? `<span class="tag good">처음부터 강한 나라</span>` : ""}${v.war ? `<span class="tag war">전쟁 중</span>` : ""}${k === "F" ? `<span class="tag war">전쟁 직전</span>` : ""}${k === "G" ? `<span class="tag world">정복과 통일</span>` : ""}${k === "H" ? `<span class="tag war">혁명 직전</span>` : ""}${v.tag ? `<span class="tag ${v.tag[0]}">${esc(v.tag[1])}</span>` : ""}</span>
        ${v.warn ? `<span class="hellwarn">⚠ ${esc(v.warn)}</span>` : ""}<span>${esc(v.text)}</span>
        <span class="mini">${ST.map((x) => `<i>${x.h}<b>${v.st[x.k]}</b></i>`).join("")}</span>
        <small>${esc(v.like)}${v.done.length ? ` · 이미 있는 제도: ${v.done.map((d) => P[d].name).join(", ")}` : ""}</small></button>`).join("")}</div>`).join("")}</section>
    <section class="panel"><h2>3. 나의 다스림 원칙</h2>
      <p class="sub">무엇을 가장 중요하게 여길지 골라요. 왕위에 오르는 날 원칙을 담은 글(즉위 교서)을 내려 고른 능력치가 조금 올라가요. 게임이 끝나면 처음 다짐과 실제 결과를 비교해요.</p>
      <div class="gsels">${[0, 1, 2].map(sel).join("")}</div></section>
    <section class="panel"><h2>게임 방법</h2>
      <ol class="qs"><li>한 시기(3년)마다 먼저 <b>나라에 일어난 일</b>에 답해요.</li>
        <li>그다음 <b>나라 살림 방법</b>을 하나 고르고, <b>국정 힘</b>만큼 정책 카드를 골라 <b>실행할 순서</b>를 정해요. 쓰지 않은 국정 힘은 다음 시기로 넘어가요(최대 2).</li>
        <li>정책에는 먼저 해야 하는 정책, 함께하면 좋은 정책, 때를 잘 맞춰야 하는 정책이 있어요. 카드의 주황색 글씨를 꼭 읽어요.</li>
        <li><b>능력치 하나라도 0이 되면 그 자리에서 나라가 무너져요!</b> 역사 속 실제로 있었던 최악의 순간이 펼쳐져요.</li>
        <li>10시기(30년)를 버티면 나라의 운명, 역사책이 붙인 이름(묘호), 나와 닮은 왕이 공개돼요.</li></ol>
      <div class="row"><button type="button" class="btn go" id="btnStart">왕위에 오르기</button></div></section>`;
  }

  function renderEvent() {
    const ev = EV[S.ev];
    const base = ev.base ? Object.entries(ev.base()).filter(([, v]) => v) : [];
    return watchBox() + `<section class="era"><h2>${S.turn}시기 · ${esc(era(S.turn))}</h2><span class="t">나라에 일어난 일</span></section>${timeline()}<div class="${hasMap() ? "evgrid" : ""}">${mapPanel("지도 · 이번에 일어난 일")}
    <section class="panel"><div class="event"><div class="bigseal ${S.ev === "breach" || S.ev === "weakking" || S.ev === "revolt" || S.ev === "empty" || S.ev === "rebel" ? "alarm" : ""}" aria-hidden="true">${ev.h}</div><div style="display:grid;gap:10px;min-width:0">
      <h3>${esc(ev.title)}</h3><p class="txt">${esc(ev.text())}</p>${base.length ? `<p class="sub">이 일로 이미 피해가 생겼어요: ${base.map(([k, v]) => `${SN[k]} ${v}`).join(", ")}</p>` : ""}
      <div class="choices">${(() => { const all = ev.choices(); return shown().map((i) => [all[i], i]).filter(([c]) => c); })().map(([c, i]) => `<button type="button" class="choice ${c.risk ? "gamble" : ""}" data-choice="${i}">${c.risk || freshChoice(i) ? `<span class="badges">${c.risk ? `<span class="riskb">모험 · 성공 확률 약 ${Math.round(c.risk * 100)}%</span>` : ""}${freshChoice(i) ? `<span class="newb">안 가 본 길</span>` : ""}</span>` : ""}<b>${esc(c.label)}</b>${c.hint ? `<small>${esc(c.hint)}</small>` : ""}</button>`).join("")}</div></div></div></section></div>`;
  }

  function advice() {
    const a = [], s = S.st;
    const danger = ST.filter((x) => s[x.k] < 15);
    if (danger.length) a.push(`위험! ${danger.map((x) => `${x.n} ${s[x.k]}`).join(", ")} — 0이 되면 그 즉시 나라가 무너져요.`);
    const low = ST.filter((x) => s[x.k] >= 15 && s[x.k] < 30).map((x) => x.n);
    if (low.length) a.push(`${jo(low.join(", "), "이", "가")} 낮아요. 그대로 두면 위기 사건이 일어날 수 있어요.`);
    if (!"EFGHJKLM".includes(S.scen) && S.turn === 4) a.push("다음 시기에 큰 나라가 쳐들어온다는 소문이 있어요. 국방을 살펴 두세요.");
    if (S.scen === "G" && S.turn === 2) a.push("서쪽의 큰 나라와 사이가 나빠지고 있다는 소문이 있어요. 군대를 살펴 두세요.");
    if (S.scen === "G" && S.turn === 4) a.push("장수들이 더 먼 정복을 꿈꾸고 있어요. 국방이 50 아래면 정복 전쟁이 위험해요.");
    if (S.scen === "H" && S.turn === 1) a.push("금고와 민심이 바닥 가까이에 있어요! 둘 중 하나라도 0이 되면 그 즉시 나라가 무너져요.");
    if (S.scen === "H" && S.turn === 3) a.push("이웃 왕국들이 군대를 모으고 있어요. 국방을 키우거나 시민의 마음을 얻어 두세요.");
    if (S.scen === "H" && S.turn === 5) a.push("전투마다 이기는 젊은 장군의 소문이 들려요.");
    if (S.scen === "F" && S.turn === 2) a.push("다음 시기에 북쪽의 새 나라가 무리한 요구를 해 올 거라는 소문이 있어요. 성과 군대를 살펴 두세요.");
    if (S.scen === "E" && S.turn === 4) a.push("일본군이 다시 쳐들어올 준비를 한다는 소문이 있어요. 국방을 키워 두세요.");
    if (ADV5[S.scen]) a.push(...ADV5[S.scen](S.turn).filter(Boolean));
    if (S.turn === 7 && !"JKLM".includes(S.scen)) a.push("하늘의 기운이 심상치 않아요. 큰 재난에 대비해 곳간과 민심을 챙겨 두세요.");
    if (s.gold < 10) a.push("곳간이 거의 비어 이번 시기에 쓸 수 있는 국정 힘이 줄었어요. '세금 더 걷기'나 '장터 열기'로 곳간을 채워요. '무역선 띄우기'는 크게 벌 수도, 잃을 수도 있어요.");
    if (s.gold >= 75) a.push("곳간이 넉넉해 이번 시기에는 국정 힘이 하나 더 있어요.");
    if (S.saved) a.push(`지난 시기에 아껴 둔 국정 힘 ${S.saved}개가 더해졌어요.`);
    if (!has("law") && S.turn <= 3 && S.scen !== "L") a.push("나라의 틀(율령)이 없으면 할 수 없는 정책이 많아요.");
    if (S.tyr >= 3) a.push("신하들 사이에 왕이 너무 무섭다는 말이 돌아요. 역사책에 어떻게 남을지 생각해 보세요.");
    if (s.kp < 30 && !has("purge") && polVisible(P.purge)) a.push("왕권이 낮을 때 숙청을 하면 반란이 일어날 수 있어요.");
    return a.slice(0, 5);
  }

  function renderPolicy() {
    const ap = apPoints(), used = usedPoints(), errs = queueErrors();
    const ev = S.evRes, adv = advice(), pj = projection();
    let list = POL.filter((p) => polVisible(p) && (UI.cat === "all" || p.cat === UI.cat));
    // 국정 힘 적은 순: 힘이 같으면 원래 순서, 이미 한 정책은 맨 뒤로
    if (UI.sort === "cost") list = list.map((p, i) => [p, i]).sort((x, y) => (!!usedUp(x[0]) - !!usedUp(y[0])) || (x[0].cost - y[0].cost) || (x[1] - y[1])).map((x) => x[0]);
    return watchBox() + `<section class="era"><h2>${S.turn}시기 · ${esc(era(S.turn))}</h2><span class="t">살림과 정책 고르기</span></section>${timeline()}${featStrip()}
    <section class="result ${ev.risk ? (ev.ok ? "won" : "lost") : ""}">${ev.risk ? `<span class="dice">${ev.ok ? "모험 성공!" : "모험 실패…"}</span>` : ""}<b>${esc(ev.title)} — ${esc(ev.choice)}</b><p>${esc(ev.text)}</p>${chips(ev.delta)}</section>
    ${adv.length ? `<section class="advice"><b>신하의 조언</b><ul>${adv.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></section>` : ""}
    <section class="panel"><div class="ap"><h2>이번 시기 나라 살림</h2><span class="sub">국정 힘이 들지 않아요. 하나를 골라요.</span></div>
      <div class="econ" role="radiogroup" aria-label="나라 살림 방법">${ECON.map((e) => `<label class="eopt ${S.econ === e.id ? "on" : ""} ${e.risk ? "gamble" : ""}"><input type="radio" name="econ" value="${e.id}" ${S.econ === e.id ? "checked" : ""}><b>${esc(e.name)}</b>${e.risk ? `<span class="riskb">성공 확률 약 ${Math.round(e.chance() * 100)}%</span><span class="sub">성공하면</span>` : ""}<span class="chips">${Object.keys(e.d).length ? ST.filter((x) => e.d[x.k]).map((x) => `<span class="chip ${e.d[x.k] > 0 ? "up" : "down"}">${x.n} ${signed(e.d[x.k])}</span>`).join("") : `<span class="chip">변화 없음</span>`}</span>${e.risk ? `<span class="sub">실패하면</span><span class="chips">${ST.filter((x) => e.fail[x.k]).map((x) => `<span class="chip down">${x.n} ${signed(e.fail[x.k])}</span>`).join("")}</span>` : ""}</label>`).join("")}</div></section>
    <section class="panel"><div class="ap"><h2>이번 시기에 펼칠 정책</h2><span class="pips" aria-label="국정 힘 ${ap} 중 ${used} 사용">${Array.from({ length: ap }, (_, i) => `<i class="${i < used ? "on" : ""}"></i>`).join("")}</span><span class="sub">국정 힘 ${used}/${ap}${S.saved ? ` (아껴 둔 힘 ${S.saved} 포함)` : ""}</span></div>
      <p class="sub">위에서부터 차례로 실행돼요. 먼저 해야 하는 정책을 위에 두세요. 남긴 국정 힘은 다음 시기로 넘어가요(최대 2).</p>
      ${S.picks.length ? `<div class="queue">${S.picks.map((id, i) => `<div class="qi ${errs[id] ? "err" : ""}"><span class="no">${i + 1}</span><span><b>${esc(P[id].name)}</b> <span class="sub">힘 ${P[id].cost}</span>${errs[id] ? `<br><span class="warn">${esc(errs[id])}</span>` : ""}</span><span class="row"><button type="button" class="btn small" data-qup="${i}" ${i === 0 ? "disabled" : ""} aria-label="위로">▲</button><button type="button" class="btn small" data-qdn="${i}" ${i === S.picks.length - 1 ? "disabled" : ""} aria-label="아래로">▼</button><button type="button" class="btn small" data-pick="${id}">빼기</button></span></div>`).join("")}</div>` : `<p class="sub">아래 카드를 눌러 정책을 담아요.</p>`}
      ${pj.zero.length ? `<p class="danger-note">이대로 하면 ${jo(pj.zero.map((k) => SN[k]).join(", "), "이", "가")} 0 아래로 떨어질 수 있어요! 0이 되면 그 즉시 나라가 무너져요.</p>` : pj.low.length ? `<p class="warn-note">이대로 하면 ${pj.low.map((k) => `${SN[k]} 약 ${pj.st[k]}`).join(", ")}까지 떨어져요. 조심하세요.</p>` : ""}
      ${UI.msg ? `<p class="warn-note">${esc(UI.msg)}</p>` : ""}
      <div class="row"><button type="button" class="btn go" id="btnRun" ${Object.keys(errs).length ? "disabled" : ""}>${S.picks.length ? "이 순서로 실행하기" : "정책 없이 이번 시기 보내기"}</button></div></section>
    ${mapPanel("지도 · 우리 군대가 갈 길")}
    <section class="tabs" role="group" aria-label="정책 종류">${[["all", "전체"], ...Object.entries(CATS).map(([k, v]) => [k, `${v.h} ${v.n}`])].map(([k, n]) => `<button type="button" data-cat="${k}" aria-pressed="${UI.cat === k}">${esc(n)}</button>`).join("")}</section>
    <section class="tabs sorts" role="group" aria-label="정책 정렬"><span class="sub">보는 순서</span>${[["base", "기본 순"], ["cost", "국정 힘 적은 순 ●→●●●"]].map(([k, n]) => `<button type="button" data-sort="${k}" aria-pressed="${UI.sort === k}">${n}</button>`).join("")}</section>
    <section class="cards">${list.map((p) => policyCard(p)).join("")}</section>`;
  }
  function policyCard(p) {
    const c = CATS[p.cat];
    const done = !!usedUp(p), picked = S.picks.indexOf(p.id);
    const lock = done ? null : lockReason(p, S.picks.slice(0, picked >= 0 ? picked : S.picks.length));
    const d = S.done.find((x) => x.id === p.id);
    return `<button type="button" class="card ${done ? "done" : ""} ${!done && picked < 0 && lock ? "locked" : ""}" style="--cc:${c.c}" data-pick="${p.id}" aria-pressed="${picked >= 0}" aria-disabled="${done}">
      <span class="top"><span class="cat" aria-hidden="true">${c.h}</span><span>${p.legend ? `<span class="ifb legend">전설의 히든 정책!</span>` : ""}${retryState(p) === "open" ? `<span class="ifb retry">한 번 더 도전! (마지막 기회)</span>` : ""}${p.uniq ? `<span class="ifb uniq">숨은 역사</span>` : ""}${featOfCard(p) ? `<span class="ifb feat">왕의 위업 · ${esc(featOfCard(p))}</span>` : ""}${p.ifs ? `<span class="ifb ${p.ultra ? "ultra" : ""}">${p.fx ? (p.need ? "역사 판타지 · 최종 도전" : "역사 판타지") : p.ultra ? "만약에? · 초모험" : "만약에? · 역사적 상상"}</span>` : ""}<h4>${esc(p.name)}</h4><span class="who">${esc(p.sub)} · ${esc(p.kings)}${WORLD() && p.w ? `<br><span class="wex">세계: ${esc(p.w)}</span>` : ""}</span></span><span class="cost pips" aria-label="국정 힘 ${p.cost}">${Array.from({ length: p.cost }, () => `<i class="on"></i>`).join("")}</span></span>
      <span class="eff">${Object.entries(p.eff).filter(([, v]) => v).map(([k, v]) => `<span>${SN[k]} <b class="${v > 0 ? "u" : "d"}">${arrows(v)}</b></span>`).join("")}${p.inc ? `<span class="incb">매 시기 수입 <b class="u">+${p.inc}</b></span>` : ""}${p.risky && !p.gamble ? `<span><b class="d">실패할 수도</b></span>` : ""}</span>

  function chartPanel() {
    const H = S.hist || [];
    if (H.length < 2) return "";
    const W = 220, HH = 86, px = 10, py = 12;
    const X = (t) => px + (W - 2 * px) * (t / TURNS), Y = (v) => py + (HH - 2 * py) * (1 - v / 100);
    const label = (t) => (t === 0 ? "시작" : `${t}시기`);
    const cells = ST.map((x) => {
      const vals = H.map((h) => h.st[x.k]), last = vals.length - 1, lo = Math.min(...vals), loI = vals.indexOf(lo);
      const pts = vals.map((v, i) => `${X(H[i].t).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
      return `<figure class="spark"><figcaption><span class="seal sm" aria-hidden="true">${x.h}</span><span>${x.n}</span><b>${vals[last]}</b><span class="sub">${signed(vals[last] - vals[0])}</span></figcaption>
        <svg viewBox="0 0 ${W} ${HH}" role="img" aria-label="${x.n}: 시작 ${vals[0]}, 마지막 ${vals[last]}, 가장 낮았을 때 ${lo}">
          <rect x="${px}" y="${Y(15).toFixed(1)}" width="${W - 2 * px}" height="${(Y(0) - Y(15)).toFixed(1)}" class="sp-danger"/>
          <line x1="${px}" x2="${W - px}" y1="${Y(50)}" y2="${Y(50)}" class="sp-mid"/>
          <polyline points="${pts}" class="sp-line"/>
          ${lo < 25 && loI !== last ? `<circle cx="${X(H[loI].t)}" cy="${Y(lo)}" r="3.5" class="sp-low"/><text x="${X(H[loI].t)}" y="${Math.max(10, Y(lo) - 7)}" class="sp-lab">${lo}</text>` : ""}
          <circle cx="${X(H[last].t)}" cy="${Y(vals[last])}" r="4.5" class="sp-end"/>
          ${vals.map((v, i) => `<circle cx="${X(H[i].t)}" cy="${Y(v)}" r="10" class="sp-hit"><title>${label(H[i].t)} ${x.n} ${v}</title></circle>`).join("")}
        </svg></figure>`;
    }).join("");
    const km = keyMoments();
    const mom = (row, good) => row && (good ? row.total > 0 : row.total < 0) ? `<div class="moment ${good ? "good" : "bad"}"><span class="sub">${good ? "가장 빛난 순간" : "가장 아찔한 순간"}</span><b>${row.L.turn}시기 · ${esc(row.L.ev.title)}</b><p>${esc(row.L.ev.choice)}${row.L.res.length ? ` → ${row.L.res.map((x) => esc(P[x.id].name)).join(", ")}` : ""}</p><span class="chip ${good ? "up" : "down"}">이 시기 변화를 모두 합치면 ${signed(row.total)}</span></div>` : "";
    return `<section class="panel"><h2>나라 살림이 걸어온 길</h2><p class="sub">시기마다 능력치가 어떻게 바뀌었는지 보여 줘요. 붉은 띠는 위험(15 아래), 점선은 50이에요. 점에 마우스를 올리면 그 시기의 값이 보여요.</p>
      <div class="sparks">${cells}</div>
      ${km ? `<div class="moments">${mom(km.best, true)}${mom(km.worst, false)}</div>` : ""}

  }

  // ================= 조작 =================
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    const d = t.dataset;
    if (t.id === "btnSkip") { if (RV && RV.final) { RV.final(false); if (!RV.fx) { RV.fx = fxStart($("fx")); RV.fx.paper(80); } } return; }
    if (t.id === "btnSound") { soundOn = !soundOn; try { localStorage.setItem(SND_KEY, soundOn ? "on" : "off"); } catch (er) { /* 무시 */ } t.setAttribute("aria-pressed", soundOn); t.textContent = soundOn ? "소리 켬" : "소리 끔"; if (soundOn) tone(660, 0, 0.15, "triangle", 0.1); return; }
    if (t.id === "btnRvDone") return closeReveal();
    if (t.id === "btnReplay") return startReveal();
    if (t.id === "btnCard") return exportFile("png");
    if (t.id === "btnPdf") return exportFile("pdf");
    if (t.id === "btnSaveClose") return closeLayer();
    if (d.scen) { S.scen = d.scen; save(); render(); return; }
    if (t.id === "btnStart") return beginReign();
    if (d.choice) return chooseEvent(+d.choice);
    if (d.cat) { UI.cat = d.cat; render(); return; }
    if (d.sort) { UI.sort = d.sort; render(); return; }
    if (d.pick) { if (t.getAttribute("aria-disabled") === "true") return; return togglePick(d.pick); }
    if (d.qup) { const i = +d.qup; [S.picks[i - 1], S.picks[i]] = [S.picks[i], S.picks[i - 1]]; save(); render(); return; }
    if (d.qdn) { const i = +d.qdn; [S.picks[i + 1], S.picks[i]] = [S.picks[i], S.picks[i + 1]]; save(); render(); return; }
    if (t.id === "btnRun") return runPolicies();
    if (t.id === "btnNext") return nextTurn();
    if (t.id === "btnAgain") return newGame();
    if (t.id === "btnNew") return askNew();
    if (t.id === "btnNewNo") return closeLayer();
    if (t.id === "btnMore") { $("layer").innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="moreTitle"><div class="modal"><h2 id="moreTitle">다음 왕의 이름은?</h2><p>${esc(KING())}의 뒤를 이을 왕의 이름을 지어 주세요. 비워 두면 '${esc(S.king.trim() || "이름 없는")} 2세'가 돼요.</p><input id="moreName" class="inp" maxlength="12" placeholder="새 왕의 이름"><div class="row"><button type="button" class="btn" id="btnNewNo">그만하기</button><button type="button" class="btn go" id="btnMoreGo">즉위식 올리기</button></div></div></div>`; $("moreName").focus(); return; }
    if (t.id === "btnMoreGo") { const nm = $("moreName").value; closeLayer(); stopReveal(); return extendReign(nm); }
    if (t.id === "btnNewYes") return newGame();
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.goal !== undefined) {
      const i = +t.dataset.goal, v = t.value, j = S.goals.indexOf(v);
      if (j >= 0 && j !== i) S.goals[j] = S.goals[i];
      S.goals[i] = v; save(); render(); const el = $("goal" + i); if (el) el.focus(); return;
    }
    if (t.name === "econ") { S.econ = t.value; save(); const y = window.scrollY; render(); window.scrollTo({ top: y }); const r = document.querySelector(`input[name="econ"][value="${S.econ}"]`); if (r) r.focus({ preventScroll: true }); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !$("layer").innerHTML) return;
    if ($("reveal")) closeReveal(); else if ($("tropen")) trDone(); else closeLayer();
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "kingName") { S.king = e.target.value; save(); }
    if (e.target.id === "nationName") { S.nation = e.target.value; save(); }
  });

  window.__K = { POL, P, EV, ECON, SCEN, ST, KINGS, get S() { return S; }, set S(v) { S = v; }, SPECIAL, portrait, render, fresh, SL_EV, SL_POL, sillokEntries, drawCard, drawSillokPages, buildPdf, canvasJpeg, apPoints, lockReason, chooseEvent, runPolicies, nextTurn, beginReign, togglePick, usedPoints, endData, fate, typeName, axes, startReveal, projection, newGame, shown, polVisible, isCore, altEnding, ALTS, FEATS, extendReign, SEEN: () => SEEN, relabel, KPREP, jPow, lPow, mapSVG, MAPS, terrInit, kingScore, SITU, achievements, treasureScore, featCount, agreeCount, statVals, avgOf, pickDisaster, ROLLP };
  render();
  if (S.phase === "end" && !S.revealed) startReveal();

})();
